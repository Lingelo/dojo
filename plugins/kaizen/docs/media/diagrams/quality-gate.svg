<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="t d">
<title id="t">The quality gate (Stop hook)</title>
<desc id="d">While /kaizen:work or /kaizen:autopilot runs, Claude cannot end a turn on red checks — three times at most.</desc>
<style>
  .bg { fill: #fbfaf7; stroke: #e4e0d8; }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 18px; font-weight: 700; }
  .desc { font-size: 12.5px; fill: #5c6370; }
  .label { font-size: 13.5px; font-weight: 600; }
  .t12 { font-size: 12px; }
  .sub { font-size: 11.5px; fill: #5c6370; }
  .small { font-size: 11px; fill: #5c6370; }
  .edge { font-size: 11px; fill: #5c6370; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .skill { fill: #fdf1ea; stroke: #d97757; }
  .artifact { fill: #edf2fb; stroke: #5b7fbf; }
  .gate { fill: #fdeeee; stroke: #c94a4a; }
  .agent { fill: #ecf6ef; stroke: #3f8f5a; }
  .outside { fill: #f3f0fa; stroke: #7a5fc0; }
  .state { fill: #fff8e1; stroke: #b8901c; }
  .plain { fill: #ffffff; stroke: #c9c4ba; }
  .region { fill: none; stroke: #b9b3a6; stroke-dasharray: 5 4; }
  .regionlabel { font-size: 11.5px; font-weight: 600; fill: #7d776b; letter-spacing: .04em; }
  .band { fill: #fff4dd; stroke: #d6a645; }
  .line { fill: none; stroke: #6e7681; stroke-width: 1.6; }
  .line.accent { stroke: #d97757; }
  .line.bad { stroke: #c94a4a; }
  .line.ok { stroke: #3f8f5a; }
  .line.blue { stroke: #5b7fbf; }
  .dashed { stroke-dasharray: 6 4; }
  .head { fill: #6e7681; }
  .head.accent { fill: #d97757; }
  .head.bad { fill: #c94a4a; }
  .head.ok { fill: #3f8f5a; }
  .head.blue { fill: #5b7fbf; }
  .pill { fill: #ffffff; stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161b22; stroke: #30363d; }
    text { fill: #e6edf3; }
    .desc, .sub, .small, .edge { fill: #9aa4b0; }
    .skill { fill: #3a2419; stroke: #e08b6c; }
    .artifact { fill: #1b2638; stroke: #7c9fd8; }
    .gate { fill: #3a1d1f; stroke: #e06c6c; }
    .agent { fill: #18301f; stroke: #5fb07a; }
    .outside { fill: #271f3d; stroke: #a08ae0; }
    .state { fill: #33290f; stroke: #d6b043; }
    .plain { fill: #1f2630; stroke: #4a525d; }
    .region { stroke: #5a6270; }
    .regionlabel { fill: #a39d90; }
    .band { fill: #33290f; stroke: #c99a3b; }
    .line { stroke: #9aa4b0; }
    .line.accent { stroke: #e08b6c; }
    .line.bad { stroke: #e06c6c; }
    .line.ok { stroke: #5fb07a; }
    .line.blue { stroke: #7c9fd8; }
    .head { fill: #9aa4b0; }
    .head.accent { fill: #e08b6c; }
    .head.bad { fill: #e06c6c; }
    .head.ok { fill: #5fb07a; }
    .head.blue { fill: #7c9fd8; }
    .pill { fill: #161b22; }
  }
</style>
<defs><marker id="h-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1099" height="559" rx="14"/>
<text class="title" x="28" y="38">The quality gate (Stop hook)</text>
<text class="desc" x="28" y="58">While /kaizen:work or /kaizen:autopilot runs, Claude cannot end a turn on red checks — three times at most.</text>
<rect class="skill" x="36" y="90" width="190" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="131" y="115" text-anchor="middle">work / autopilot</text>
<text class="sub" x="131" y="130" text-anchor="middle">node $K gate on --plan p</text>
<rect class="state" x="36" y="186" width="190" height="64" rx="10" stroke-width="1.5"/>
<text class="label" x="131" y="208" text-anchor="middle">gate.json</text>
<text class="sub" x="131" y="223" text-anchor="middle">active · since · blocks</text>
<text class="sub" x="131" y="237" text-anchor="middle">session · usage</text>
<rect class="gate" x="36" y="290" width="190" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="131" y="315" text-anchor="middle">PostToolUse --claim</text>
<text class="sub" x="131" y="330" text-anchor="middle">binds gate to session</text>
<path class="line accent" d="M131,146 L131,186" marker-end="url(#h-accent)"/>
<path class="line bad" d="M131,290 L131,250" marker-end="url(#h-bad)"/>
<rect class="outside" x="290" y="90" width="170" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="375" y="115" text-anchor="middle" style="font-size:12.8px">Claude ends a turn</text>
<text class="sub" x="375" y="130" text-anchor="middle">Stop event</text>
<rect class="gate" x="520" y="86" width="330" height="46" rx="8" stroke-width="1.5"/>
<text class="label" x="685" y="113" text-anchor="middle">active and same session?</text>
<rect class="gate" x="520" y="152" width="330" height="46" rx="8" stroke-width="1.5"/>
<text class="label" x="685" y="179" text-anchor="middle">older than max_age_hours (24 h)?</text>
<rect class="plain" x="520" y="218" width="330" height="46" rx="8" stroke-width="1.5"/>
<text class="label" x="685" y="245" text-anchor="middle">record tokens: main + subagents</text>
<rect class="plain" x="520" y="284" width="330" height="46" rx="8" stroke-width="1.5"/>
<text class="label" x="685" y="311" text-anchor="middle">run verify (budget 840 s)</text>
<rect class="gate" x="520" y="350" width="330" height="46" rx="8" stroke-width="1.5"/>
<text class="label" x="685" y="377" text-anchor="middle">all checks green?</text>
<rect class="gate" x="520" y="416" width="330" height="46" rx="8" stroke-width="1.5"/>
<text class="label" x="685" y="443" text-anchor="middle">blocks &gt; max_blocks (3)?</text>
<path class="line" d="M460,118 L520,109" marker-end="url(#h-default)"/>
<path class="line" d="M685,132 L685,152" marker-end="url(#h-default)"/>
<rect class="pill" x="688" y="135" width="28.299999999999997" height="17" rx="4"/>
<text class="edge" x="693" y="146" text-anchor="start">yes</text>
<path class="line" d="M685,198 L685,218" marker-end="url(#h-default)"/>
<rect class="pill" x="688" y="201" width="22.2" height="17" rx="4"/>
<text class="edge" x="693" y="212" text-anchor="start">no</text>
<path class="line" d="M685,264 L685,284" marker-end="url(#h-default)"/>
<path class="line" d="M685,330 L685,350" marker-end="url(#h-default)"/>
<path class="line" d="M685,396 L685,416" marker-end="url(#h-default)"/>
<rect class="pill" x="688" y="399" width="22.2" height="17" rx="4"/>
<text class="edge" x="693" y="410" text-anchor="start">no</text>
<rect class="plain" x="892" y="86" width="176" height="46" rx="8" stroke-width="1.5"/>
<text class="label" x="980" y="113" text-anchor="middle">finish (exit 0)</text>
<rect class="plain" x="892" y="152" width="176" height="46" rx="8" stroke-width="1.5"/>
<text class="label" x="980" y="179" text-anchor="middle">expired: removed</text>
<rect class="plain" x="892" y="350" width="176" height="46" rx="8" stroke-width="1.5"/>
<text class="label" x="980" y="377" text-anchor="middle">finish, reset</text>
<rect class="state" x="892" y="416" width="176" height="56" rx="10" stroke-width="1.5"/>
<text class="label" x="980" y="441" text-anchor="middle" style="font-size:13.3px">finish, but report</text>
<text class="sub" x="980" y="456" text-anchor="middle" style="font-size:10.5px">what is still red, honestly</text>
<rect class="gate" x="520" y="490" width="330" height="52" rx="8" stroke-width="1.5"/>
<text class="label" x="685" y="513" text-anchor="middle">BLOCK (exit 2)</text>
<text class="sub" x="685" y="528" text-anchor="middle">failure tails sent back: fix the root cause</text>
<path class="line" d="M850,109 L892,109" marker-end="url(#h-default)"/>
<rect class="pill" x="859.9" y="92" width="22.2" height="17" rx="4"/>
<text class="edge" x="871" y="103" text-anchor="middle">no</text>
<path class="line" d="M850,175 L892,175" marker-end="url(#h-default)"/>
<rect class="pill" x="856.85" y="158" width="28.299999999999997" height="17" rx="4"/>
<text class="edge" x="871" y="169" text-anchor="middle">yes</text>
<path class="line ok" d="M850,373 L892,373" marker-end="url(#h-ok)"/>
<rect class="pill" x="856.85" y="356" width="28.299999999999997" height="17" rx="4"/>
<text class="edge" x="871" y="367" text-anchor="middle">yes</text>
<path class="line" d="M850,439 L892,438.4" marker-end="url(#h-default)"/>
<rect class="pill" x="856.85" y="421.7" width="28.299999999999997" height="17" rx="4"/>
<text class="edge" x="871" y="432.7" text-anchor="middle">yes</text>
<path class="line bad" d="M685,462 L685,490" marker-end="url(#h-bad)"/>
<rect class="pill" x="688" y="469" width="22.2" height="17" rx="4"/>
<text class="edge" x="693" y="480" text-anchor="start">no</text>
<path class="line bad dashed" d="M520,516 L480,516 L480,180 L375,180 L375,146" marker-end="url(#h-bad)"/>
<rect class="pill" x="361.5" y="163" width="132" height="17" rx="4"/>
<text class="edge" x="427.5" y="174" text-anchor="middle">Claude keeps working</text>
<text class="small" x="290" y="236" text-anchor="start">targeted checks:</text>
<text class="small" x="290" y="251" text-anchor="start">gate.targeted with {files}</text>
<text class="small" x="290" y="266" text-anchor="start">= only what the branch touches</text>
<rect class="skill" x="36" y="410" width="190" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="131" y="435" text-anchor="middle">gate off</text>
<text class="sub" x="131" y="450" text-anchor="middle">end of the cycle</text>
<rect class="artifact" x="36" y="486" width="400" height="50" rx="8" stroke-width="1.5"/>
<text class="label" x="48" y="508" text-anchor="start">.kaizen/state/cycles.jsonl</text>
<text class="sub" x="48" y="523" text-anchor="start" style="font-size:10.4px">plan · minutes · gate blocks · tokens by role → metrics cycle_cost</text>
<path class="line blue" d="M131,466 L131,486" marker-end="url(#h-blue)"/>
</svg>
