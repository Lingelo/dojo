<rect class="skill" x="600" y="444" width="464" height="32" rx="6" stroke-width="1.5"/>
<text class="label mono" x="612" y="464" text-anchor="start">/kaizen:plan &lt;plan&gt;</text>
<path class="line" d="M516,460 L600,460" marker-end="url(#h-default)"/>
<text class="small" x="24" y="465" text-anchor="end">10</text>
<rect class="gate" x="36" y="484" width="480" height="32" rx="6" stroke-width="1.5"/>
