<text class="label" x="48" y="144" text-anchor="start">incident resolved &lt; 14 days ago, no postmortem</text>
<rect class="skill" x="600" y="124" width="464" height="32" rx="6" stroke-width="1.5"/>
<text class="label mono" x="612" y="144" text-anchor="start">/kaizen:postmortem</text>
