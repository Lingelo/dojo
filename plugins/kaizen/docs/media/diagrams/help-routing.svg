<rect class="bg" x="0.5" y="0.5" width="1099" height="599" rx="14"/>
<text class="title" x="28" y="38">What /kaizen:help recommends next</text>
<text class="desc" x="28" y="58">node $K status reads the repo and returns the first situation that applies, in this order.</text>
