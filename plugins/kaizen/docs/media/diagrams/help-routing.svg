<text class="label" x="48" y="344" text-anchor="start">feature branch · reviewed, committed, clean</text>
<rect class="skill" x="600" y="324" width="464" height="32" rx="6" stroke-width="1.5"/>
<text class="label mono" x="612" y="344" text-anchor="start">/kaizen:ship</text>
