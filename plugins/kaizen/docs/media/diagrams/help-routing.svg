<rect class="skill" x="600" y="404" width="464" height="32" rx="6" stroke-width="1.5"/>
<text class="label mono" x="612" y="424" text-anchor="start">/kaizen:deploy &lt;env&gt;</text>
<path class="line" d="M516,420 L600,420" marker-end="url(#h-default)"/>
<text class="small" x="24" y="425" text-anchor="end">9</text>
<rect class="gate" x="36" y="444" width="480" height="32" rx="6" stroke-width="1.5"/>
