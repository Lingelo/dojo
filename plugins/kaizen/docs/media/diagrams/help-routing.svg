<rect class="skill" x="600" y="484" width="464" height="32" rx="6" stroke-width="1.5"/>
<text class="label mono" x="612" y="504" text-anchor="start">/kaizen:work &lt;plan&gt;</text>
<path class="line" d="M516,500 L600,500" marker-end="url(#h-default)"/>
<text class="small" x="24" y="505" text-anchor="end">11</text>
<rect class="gate" x="36" y="524" width="480" height="32" rx="6" stroke-width="1.5"/>
<text class="label" x="48" y="544" text-anchor="start">otherwise</text>
<rect class="skill" x="600" y="524" width="464" height="32" rx="6" stroke-width="1.5"/>
<text class="label mono" x="612" y="544" text-anchor="start">/kaizen:brainstorm &lt;idea&gt; · ideate · debug</text>
<path class="line ok" d="M516,540 L600,540" marker-end="url(#h-ok)"/>
<text class="small" x="24" y="545" text-anchor="end">12</text>
<text class="small" x="36" y="580" text-anchor="start">The first two are added before everything else; "otherwise" is also added when the repo is in a normal state. /kaizen:help explains the result and can also answer “what is Kaizen?”.</text>
</svg>
