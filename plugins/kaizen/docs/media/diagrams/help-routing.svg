<text class="label mono" x="612" y="264" text-anchor="start">/kaizen:work (resume) or gate off</text>
<path class="line" d="M516,260 L600,260" marker-end="url(#h-default)"/>
<text class="small" x="24" y="265" text-anchor="end">5</text>
<rect class="gate" x="36" y="284" width="480" height="32" rx="6" stroke-width="1.5"/>
<text class="label" x="48" y="304" text-anchor="start">feature branch with changes · waiver pending</text>
