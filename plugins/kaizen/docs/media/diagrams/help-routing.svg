<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="t d">
<title id="t">What /kaizen:help recommends next</title>
<desc id="d">node $K status reads the repo and returns the first situation that applies, in this order.</desc>
<style>
  .bg { fill: #fbfaf7; stroke: #e4e0d8; }
