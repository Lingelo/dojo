<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="t d">
<title id="t">How the constitution is enforced</title>
<desc id="d">A principle without a verifiable Check is not applied: every article is checked at plan time, at review time, and in the PR.</desc>
<style>
