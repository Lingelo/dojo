<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d">
<title id="t">Driving a PR to "looks ready" (/kaizen:watch-pr)</title>
<desc id="d">Feedback before CI, CI before branch updates, a token-free watcher between cycles. You merge, never Kaizen.</desc>
<style>
  .bg { fill: #fbfaf7; stroke: #e4e0d8; }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 18px; font-weight: 700; }
  .desc { font-size: 12.5px; fill: #5c6370; }
  .label { font-size: 13.5px; font-weight: 600; }
  .t12 { font-size: 12px; }
  .sub { font-size: 11.5px; fill: #5c6370; }
  .small { font-size: 11px; fill: #5c6370; }
  .edge { font-size: 11px; fill: #5c6370; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .skill { fill: #fdf1ea; stroke: #d97757; }
  .artifact { fill: #edf2fb; stroke: #5b7fbf; }
  .gate { fill: #fdeeee; stroke: #c94a4a; }
  .agent { fill: #ecf6ef; stroke: #3f8f5a; }
  .outside { fill: #f3f0fa; stroke: #7a5fc0; }
  .state { fill: #fff8e1; stroke: #b8901c; }
  .plain { fill: #ffffff; stroke: #c9c4ba; }
  .region { fill: none; stroke: #b9b3a6; stroke-dasharray: 5 4; }
  .regionlabel { font-size: 11.5px; font-weight: 600; fill: #7d776b; letter-spacing: .04em; }
  .band { fill: #fff4dd; stroke: #d6a645; }
  .line { fill: none; stroke: #6e7681; stroke-width: 1.6; }
  .line.accent { stroke: #d97757; }
  .line.bad { stroke: #c94a4a; }
  .line.ok { stroke: #3f8f5a; }
  .line.blue { stroke: #5b7fbf; }
  .dashed { stroke-dasharray: 6 4; }
  .head { fill: #6e7681; }
  .head.accent { fill: #d97757; }
  .head.bad { fill: #c94a4a; }
  .head.ok { fill: #3f8f5a; }
  .head.blue { fill: #5b7fbf; }
  .pill { fill: #ffffff; stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161b22; stroke: #30363d; }
    text { fill: #e6edf3; }
    .desc, .sub, .small, .edge { fill: #9aa4b0; }
    .skill { fill: #3a2419; stroke: #e08b6c; }
    .artifact { fill: #1b2638; stroke: #7c9fd8; }
    .gate { fill: #3a1d1f; stroke: #e06c6c; }
    .agent { fill: #18301f; stroke: #5fb07a; }
    .outside { fill: #271f3d; stroke: #a08ae0; }
    .state { fill: #33290f; stroke: #d6b043; }
    .plain { fill: #1f2630; stroke: #4a525d; }
    .region { stroke: #5a6270; }
    .regionlabel { fill: #a39d90; }
    .band { fill: #33290f; stroke: #c99a3b; }
    .line { stroke: #9aa4b0; }
    .line.accent { stroke: #e08b6c; }
    .line.bad { stroke: #e06c6c; }
    .line.ok { stroke: #5fb07a; }
    .line.blue { stroke: #7c9fd8; }
    .head { fill: #9aa4b0; }
    .head.accent { fill: #e08b6c; }
    .head.bad { fill: #e06c6c; }
    .head.ok { fill: #5fb07a; }
    .head.blue { fill: #7c9fd8; }
    .pill { fill: #161b22; }
  }
</style>
<defs><marker id="h-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1099" height="639" rx="14"/>
<text class="title" x="28" y="38">Driving a PR to "looks ready" (/kaizen:watch-pr)</text>
<text class="desc" x="28" y="58">Feedback before CI, CI before branch updates, a token-free watcher between cycles. You merge, never Kaizen.</text>
<rect class="gate" x="36" y="90" width="220" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="146" y="110" text-anchor="middle">pr snapshot</text>
<text class="sub" x="146" y="125" text-anchor="middle">paginated threads, comments,</text>
<text class="sub" x="146" y="139" text-anchor="middle" style="font-size:11px">reviews, head checks, merge state</text>
<rect class="plain" x="36" y="182" width="220" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="146" y="208" text-anchor="middle">merged / closed → stop</text>
<rect class="skill" x="320" y="90" width="300" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="470" y="112" text-anchor="middle">1. Feedback first</text>
<text class="sub" x="470" y="127" text-anchor="middle">address-feedback once, then</text>
<text class="sub" x="470" y="141" text-anchor="middle">pr mark each item (handled)</text>
<rect class="skill" x="320" y="174" width="300" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="470" y="203" text-anchor="middle">2. Head moved?</text>
<text class="sub" x="470" y="218" text-anchor="middle">observed CI is stale: wait</text>
<rect class="skill" x="320" y="258" width="300" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="470" y="280" text-anchor="middle">3. CI red</text>
<text class="sub" x="470" y="295" text-anchor="middle">infra failure: one rerun</text>
<text class="sub" x="470" y="309" text-anchor="middle">real failure: logs → debug → push</text>
<rect class="skill" x="320" y="342" width="300" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="470" y="364" text-anchor="middle">4. Branch currency</text>
<text class="sub" x="470" y="379" text-anchor="middle">BEHIND → update-branch API</text>
<text class="sub" x="470" y="393" text-anchor="middle">DIRTY → merge base locally</text>
<rect class="skill" x="320" y="426" width="300" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="470" y="448" text-anchor="middle">5. Convergence</text>
<text class="sub" x="470" y="463" text-anchor="middle">same check red after 2 fixes,</text>
<text class="sub" x="470" y="477" text-anchor="middle">or threads growing → stop</text>
<path class="line accent" d="M256,120 L320,122" marker-end="url(#h-accent)"/>
<path class="line" d="M146,150 L146,182" marker-end="url(#h-default)"/>
<path class="line accent" d="M470,154 L470,174" marker-end="url(#h-accent)"/>
<path class="line accent" d="M470,238 L470,258" marker-end="url(#h-accent)"/>
<path class="line accent" d="M470,322 L470,342" marker-end="url(#h-accent)"/>
<path class="line accent" d="M470,406 L470,426" marker-end="url(#h-accent)"/>
<rect class="gate" x="320" y="524" width="300" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="470" y="546" text-anchor="middle">pr watch --interval 150</text>
<text class="sub" x="470" y="561" text-anchor="middle">polls GitHub, no tokens spent,</text>
<text class="sub" x="470" y="575" text-anchor="middle">exits with a KAIZEN_WAKE line</text>
<path class="line accent" d="M470,490 L470,524" marker-end="url(#h-accent)"/>
<path class="line ok dashed" d="M320,556 L22,556 L22,120 L36,120" marker-end="url(#h-ok)"/>
<rect class="pill" x="25" y="319" width="156.39999999999998" height="17" rx="4"/>
<text class="edge" x="30" y="330" text-anchor="start">KAIZEN_WAKE → next cycle</text>
<rect class="region" x="660" y="76" width="412" height="300" rx="12"/>
<text class="regionlabel" x="672" y="93">WATCHER VERDICTS</text>
<text class="label mono" x="680" y="120" text-anchor="start">terminal</text>
<text class="small" x="860" y="120" text-anchor="start">merged or closed</text>
<text class="label mono" x="680" y="150" text-anchor="start">budget</text>
<text class="small" x="860" y="150" text-anchor="start">8 h active (3-day safety net)</text>
<text class="label mono" x="680" y="180" text-anchor="start">actionable</text>
<text class="small" x="860" y="180" text-anchor="start">open thread, comment or red check</text>
<text class="label mono" x="680" y="210" text-anchor="start">behind / conflict</text>
<text class="small" x="860" y="210" text-anchor="start">GitHub says BEHIND / DIRTY</text>
<text class="label mono" x="680" y="240" text-anchor="start">looks-ready</text>
<text class="small" x="860" y="240" text-anchor="start">see the conditions below</text>
<text class="label mono" x="680" y="270" text-anchor="start">blocked-failing</text>
<text class="small" x="860" y="270" text-anchor="start">every red check already handled</text>
<text class="label mono" x="680" y="300" text-anchor="start">blocked-external</text>
<text class="small" x="860" y="300" text-anchor="start">fork CI waiting for approval</text>
<text class="label mono" x="680" y="330" text-anchor="start">needs-human</text>
<text class="small" x="860" y="330" text-anchor="start">decision left to a human</text>
<rect class="state" x="660" y="396" width="412" height="192" rx="12" stroke-width="1.5"/>
<text class="label" x="866" y="496" text-anchor="middle"></text>
<text class="label" x="680" y="424" text-anchor="start">looks-ready requires all of:</text>
<text class="small" x="680" y="452" text-anchor="start">· mergeable = MERGEABLE, merge state CLEAN</text>
<text class="small" x="680" y="467" text-anchor="start">· checks finished and green</text>
<text class="small" x="680" y="482" text-anchor="start">· no open thread or comment, no human decision</text>
<text class="small" x="680" y="497" text-anchor="start">· branch up to date</text>
<text class="small" x="680" y="512" text-anchor="start">· PR quiet for ≥ 5 min (settle_seconds 300)</text>
<text class="small" x="680" y="527" text-anchor="start">· no review on its way (👀, "reviewing…"), description true</text>
<text class="small" x="36" y="620" text-anchor="start">Kaizen messages carry &lt;!-- kaizen --&gt; and are context, never feedback. State: .kaizen/state/pr/&lt;owner&gt;-&lt;repo&gt;-&lt;n&gt;.json (delete it to start over).</text>
</svg>
