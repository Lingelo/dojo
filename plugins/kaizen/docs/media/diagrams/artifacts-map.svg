<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="496" viewBox="0 0 1100 496" role="img" aria-labelledby="t d">
<title id="t">What Kaizen writes in your repo, and who reads it</title>
<desc id="d">Kaizen keeps few files: the learnings and its configuration are versioned; its state stays on your machine.</desc>
<style>
  .bg { fill: #fbfaf7; stroke: #e4e0d8; }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 18px; font-weight: 700; }
  .desc { font-size: 12.5px; fill: #5c6370; }
  .label { font-size: 13.5px; font-weight: 600; }
  .t12 { font-size: 12px; }
  .sub { font-size: 11.5px; fill: #5c6370; }
  .small { font-size: 11px; fill: #5c6370; }
  .edge { font-size: 11px; fill: #5c6370; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .skill { fill: #fdf1ea; stroke: #d97757; }
  .artifact { fill: #edf2fb; stroke: #5b7fbf; }
  .gate { fill: #fdeeee; stroke: #c94a4a; }
  .agent { fill: #ecf6ef; stroke: #3f8f5a; }
  .outside { fill: #f3f0fa; stroke: #7a5fc0; }
  .state { fill: #fff8e1; stroke: #b8901c; }
  .plain { fill: #ffffff; stroke: #c9c4ba; }
  .region { fill: none; stroke: #b9b3a6; stroke-dasharray: 5 4; }
  .regionlabel { font-size: 11.5px; font-weight: 600; fill: #7d776b; letter-spacing: .04em; }
  .band { fill: #fff4dd; stroke: #d6a645; }
  .line { fill: none; stroke: #6e7681; stroke-width: 1.6; }
  .line.accent { stroke: #d97757; }
  .line.bad { stroke: #c94a4a; }
  .line.ok { stroke: #3f8f5a; }
  .line.blue { stroke: #5b7fbf; }
  .dashed { stroke-dasharray: 6 4; }
  .head { fill: #6e7681; }
  .head.accent { fill: #d97757; }
  .head.bad { fill: #c94a4a; }
  .head.ok { fill: #3f8f5a; }
  .head.blue { fill: #5b7fbf; }
  .pill { fill: #ffffff; stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161b22; stroke: #30363d; }
    text { fill: #e6edf3; }
    .desc, .sub, .small, .edge { fill: #9aa4b0; }
    .skill { fill: #3a2419; stroke: #e08b6c; }
    .artifact { fill: #1b2638; stroke: #7c9fd8; }
    .gate { fill: #3a1d1f; stroke: #e06c6c; }
    .agent { fill: #18301f; stroke: #5fb07a; }
    .outside { fill: #271f3d; stroke: #a08ae0; }
    .state { fill: #33290f; stroke: #d6b043; }
    .plain { fill: #1f2630; stroke: #4a525d; }
    .region { stroke: #5a6270; }
    .regionlabel { fill: #a39d90; }
    .band { fill: #33290f; stroke: #c99a3b; }
    .line { stroke: #9aa4b0; }
    .line.accent { stroke: #e08b6c; }
    .line.bad { stroke: #e06c6c; }
    .line.ok { stroke: #5fb07a; }
    .line.blue { stroke: #7c9fd8; }
    .head { fill: #9aa4b0; }
    .head.accent { fill: #e08b6c; }
    .head.bad { fill: #e06c6c; }
    .head.ok { fill: #5fb07a; }
    .head.blue { fill: #7c9fd8; }
    .pill { fill: #161b22; }
  }
</style>
<defs><marker id="h-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1099" height="495" rx="14"/>
<text class="title" x="28" y="38">What Kaizen writes in your repo, and who reads it</text>
<text class="desc" x="28" y="58">Kaizen keeps few files: the learnings and its configuration are versioned; its state stays on your machine.</text>
<text class="regionlabel" x="36" y="88" text-anchor="start">WRITTEN BY</text>
<text class="regionlabel" x="296" y="88" text-anchor="start">FILE</text>
<text class="regionlabel" x="678" y="88" text-anchor="start">READ BY</text>
<rect class="skill" x="36" y="100" width="230" height="48" rx="8" stroke-width="1.5"/>
<text class="label" x="151" y="128" text-anchor="middle">/kaizen:learn</text>
<rect class="artifact" x="296" y="100" width="350" height="48" rx="8" stroke-width="1.5"/>
<text class="t12 mono" x="471" y="128" text-anchor="middle">docs/learnings/&lt;folder&gt;/&lt;slug&gt;.md</text>
<rect class="plain" x="678" y="100" width="386" height="48" rx="8" stroke-width="1.5"/>
<text class="t12" x="871" y="128" text-anchor="middle">post-edit hook → Claude, at spec, plan, edit</text>
<path class="line accent" d="M266,124 L296,124" marker-end="url(#h-accent)"/>
<path class="line blue" d="M646,124 L678,124" marker-end="url(#h-blue)"/>
<rect class="skill" x="36" y="164" width="230" height="48" rx="8" stroke-width="1.5"/>
<text class="label" x="151" y="192" text-anchor="middle">/kaizen:setup · init</text>
<rect class="artifact" x="296" y="164" width="350" height="48" rx="8" stroke-width="1.5"/>
<text class="t12 mono" x="471" y="192" text-anchor="middle">.kaizen/config.json</text>
<rect class="plain" x="678" y="164" width="386" height="48" rx="8" stroke-width="1.5"/>
<text class="t12" x="871" y="192" text-anchor="middle">every hook and the CLI</text>
<path class="line accent" d="M266,188 L296,188" marker-end="url(#h-accent)"/>
<path class="line blue" d="M646,188 L678,188" marker-end="url(#h-blue)"/>
<rect class="skill" x="36" y="228" width="230" height="48" rx="8" stroke-width="1.5"/>
<text class="label" x="151" y="256" text-anchor="middle">/kaizen:setup</text>
<rect class="artifact" x="296" y="228" width="350" height="48" rx="8" stroke-width="1.5"/>
<text class="t12 mono" x="471" y="256" text-anchor="middle">.claude/settings.json</text>
<rect class="plain" x="678" y="228" width="386" height="48" rx="8" stroke-width="1.5"/>
<text class="t12" x="871" y="256" text-anchor="middle">Claude Code: Kaizen for every clone</text>
<path class="line accent" d="M266,252 L296,252" marker-end="url(#h-accent)"/>
<path class="line blue" d="M646,252 L678,252" marker-end="url(#h-blue)"/>
<rect class="skill" x="36" y="292" width="230" height="48" rx="8" stroke-width="1.5"/>
<text class="label" x="151" y="320" text-anchor="middle">hooks · CLI</text>
<rect class="state" x="296" y="292" width="350" height="48" rx="10" stroke-width="1.5"/>
<text class="t12 mono" x="471" y="320" text-anchor="middle">.kaizen/state/ (git-ignored)</text>
<rect class="plain" x="678" y="292" width="386" height="48" rx="8" stroke-width="1.5"/>
<text class="t12" x="871" y="320" text-anchor="middle">gates · watch · metrics · cost</text>
<path class="line accent" d="M266,316 L296,316" marker-end="url(#h-accent)"/>
<path class="line blue" d="M646,316 L678,316" marker-end="url(#h-blue)"/>
<rect class="agent" x="36" y="356" width="230" height="48" rx="8" stroke-width="1.5"/>
<text class="label" x="151" y="384" text-anchor="middle">agent-skills</text>
<rect class="artifact" x="296" y="356" width="350" height="48" rx="8" stroke-width="1.5"/>
<text class="t12 mono" x="471" y="384" text-anchor="middle">SPEC.md · tasks/ · CONSTRAINTS.md</text>
<rect class="plain" x="678" y="356" width="386" height="48" rx="8" stroke-width="1.5"/>
<text class="t12" x="871" y="384" text-anchor="middle">Kaizen reads them (doctor, status, learnings)</text>
<path class="line accent" d="M266,380 L296,380" marker-end="url(#h-accent)"/>
<path class="line blue" d="M646,380 L678,380" marker-end="url(#h-blue)"/>
<text class="small" x="36" y="436" text-anchor="start">Default root docs/ (docs_root). No file carries a mutable "status": progress is read from git and from agent-skills’ task checkboxes.</text>
<rect class="agent" x="36" y="466" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="60" y="476">agent-skills command (/kaizen:spec…)</text>
<rect class="skill" x="305.20000000000005" y="466" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="329.20000000000005" y="476">Kaizen skill (setup, learn, metrics, watch)</text>
<rect class="artifact" x="617.8000000000001" y="466" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="641.8000000000001" y="476">file in your repo</text>
<rect class="state" x="769.2" y="466" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="793.2" y="476">local state</text>
</svg>
