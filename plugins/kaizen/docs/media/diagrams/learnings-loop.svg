<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="t d">
<title id="t">How learnings compound</title>
<desc id="d">A lesson only counts once it is read back. Kaizen reads it back by itself, measures the reuse, and prunes what nobody uses.</desc>
<style>
  .bg { fill: #fbfaf7; stroke: #e4e0d8; }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 18px; font-weight: 700; }
  .desc { font-size: 12.5px; fill: #5c6370; }
  .label { font-size: 13.5px; font-weight: 600; }
  .t12 { font-size: 12px; }
  .sub { font-size: 11.5px; fill: #5c6370; }
  .small { font-size: 11px; fill: #5c6370; }
  .edge { font-size: 11px; fill: #5c6370; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .skill { fill: #fdf1ea; stroke: #d97757; }
  .artifact { fill: #edf2fb; stroke: #5b7fbf; }
  .gate { fill: #fdeeee; stroke: #c94a4a; }
  .agent { fill: #ecf6ef; stroke: #3f8f5a; }
  .outside { fill: #f3f0fa; stroke: #7a5fc0; }
  .state { fill: #fff8e1; stroke: #b8901c; }
  .plain { fill: #ffffff; stroke: #c9c4ba; }
  .region { fill: none; stroke: #b9b3a6; stroke-dasharray: 5 4; }
  .regionlabel { font-size: 11.5px; font-weight: 600; fill: #7d776b; letter-spacing: .04em; }
  .band { fill: #fff4dd; stroke: #d6a645; }
  .line { fill: none; stroke: #6e7681; stroke-width: 1.6; }
  .line.accent { stroke: #d97757; }
  .line.bad { stroke: #c94a4a; }
  .line.ok { stroke: #3f8f5a; }
  .line.blue { stroke: #5b7fbf; }
  .dashed { stroke-dasharray: 6 4; }
  .head { fill: #6e7681; }
  .head.accent { fill: #d97757; }
  .head.bad { fill: #c94a4a; }
  .head.ok { fill: #3f8f5a; }
  .head.blue { fill: #5b7fbf; }
  .pill { fill: #ffffff; stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161b22; stroke: #30363d; }
    text { fill: #e6edf3; }
    .desc, .sub, .small, .edge { fill: #9aa4b0; }
    .skill { fill: #3a2419; stroke: #e08b6c; }
    .artifact { fill: #1b2638; stroke: #7c9fd8; }
    .gate { fill: #3a1d1f; stroke: #e06c6c; }
    .agent { fill: #18301f; stroke: #5fb07a; }
    .outside { fill: #271f3d; stroke: #a08ae0; }
    .state { fill: #33290f; stroke: #d6b043; }
    .plain { fill: #1f2630; stroke: #4a525d; }
    .region { stroke: #5a6270; }
    .regionlabel { fill: #a39d90; }
    .band { fill: #33290f; stroke: #c99a3b; }
    .line { stroke: #9aa4b0; }
    .line.accent { stroke: #e08b6c; }
    .line.bad { stroke: #e06c6c; }
    .line.ok { stroke: #5fb07a; }
    .line.blue { stroke: #7c9fd8; }
    .head { fill: #9aa4b0; }
    .head.accent { fill: #e08b6c; }
    .head.bad { fill: #e06c6c; }
    .head.ok { fill: #5fb07a; }
    .head.blue { fill: #7c9fd8; }
    .pill { fill: #161b22; }
  }
</style>
<defs><marker id="h-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1099" height="559" rx="14"/>
<text class="title" x="28" y="38">How learnings compound</text>
<text class="desc" x="28" y="58">A lesson only counts once it is read back. Kaizen reads it back by itself, measures the reuse, and prunes what nobody uses.</text>
<rect class="outside" x="36" y="90" width="220" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="146" y="115" text-anchor="middle">a problem solved</text>
<text class="sub" x="146" y="130" text-anchor="middle">and verified</text>
<rect class="skill" x="36" y="186" width="220" height="76" rx="8" stroke-width="1.5"/>
<text class="label" x="146" y="214" text-anchor="middle">/kaizen:learn</text>
<text class="sub" x="146" y="229" text-anchor="middle">durability test: would someone</text>
<text class="sub" x="146" y="243" text-anchor="middle" style="font-size:10.6px">make the mistake again without it?</text>
<rect class="plain" x="36" y="300" width="220" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="146" y="326" text-anchor="middle" style="font-size:12.3px">“Learning not written: …”</text>
<path class="line accent" d="M146,146 L146,186" marker-end="url(#h-accent)"/>
<path class="line" d="M146,262 L146,300" marker-end="url(#h-default)"/>
<rect class="pill" x="149" y="274" width="22.2" height="17" rx="4"/>
<text class="edge" x="154" y="285" text-anchor="start">no</text>
<rect class="artifact" x="320" y="160" width="330" height="128" rx="8" stroke-width="1.5"/>
<text class="label" x="332" y="228" text-anchor="start"></text>
<text class="small mono" x="336" y="186" text-anchor="start">docs/learnings/&lt;folder&gt;/&lt;slug&gt;.md</text>
<text class="small" x="336" y="210" text-anchor="start">title · date · module · problem_type</text>
<text class="small" x="336" y="225" text-anchor="start">component · severity · tags · files</text>
<text class="small" x="336" y="240" text-anchor="start">bug: symptoms · root_cause · resolution_type</text>
<text class="small" x="336" y="255" text-anchor="start">knowledge: applies_when</text>
<path class="line blue" d="M256,224 L320,224" marker-end="url(#h-blue)"/>
<rect class="pill" x="237.25" y="205" width="101.5" height="17" rx="4"/>
<text class="edge" x="288" y="216" text-anchor="middle">yes · validated</text>
<rect class="region" x="690" y="76" width="382" height="230" rx="12"/>
<text class="regionlabel" x="702" y="93">READ BACK BY POST-EDIT.MJS (NO COMMAND)</text>
<rect class="agent" x="706" y="112" width="350" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="881" y="134" text-anchor="middle">SPEC.md or tasks/ written</text>
<text class="sub" x="881" y="149" text-anchor="middle">matching learnings added to Claude’s</text>
<text class="sub" x="881" y="163" text-anchor="middle">context, cited in tasks/plan.md</text>
<rect class="gate" x="706" y="196" width="350" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="881" y="218" text-anchor="middle">a file edited</text>
<text class="sub" x="881" y="233" text-anchor="middle">learnings whose files: globs match it,</text>
<text class="sub" x="881" y="247" text-anchor="middle">once per session</text>
<path class="line ok" d="M650,198.4 L706,144" marker-end="url(#h-ok)"/>
<path class="line ok" d="M650,249.6 L706,228" marker-end="url(#h-ok)"/>
<rect class="state" x="706" y="330" width="166" height="60" rx="12" stroke-width="1.5"/>
<text class="label" x="789" y="357" text-anchor="middle">cited by a plan</text>
<text class="sub" x="789" y="372" text-anchor="middle">= read</text>
<rect class="state" x="890" y="330" width="166" height="60" rx="12" stroke-width="1.5"/>
<text class="label" x="973" y="357" text-anchor="middle" style="font-size:13.2px">cited by a commit</text>
<text class="sub" x="973" y="372" text-anchor="middle">= applied</text>
<rect class="skill" x="690" y="420" width="382" height="66" rx="8" stroke-width="1.5"/>
<text class="label" x="881" y="450" text-anchor="middle">/kaizen:metrics → kaizen_loop</text>
<text class="sub" x="881" y="465" text-anchor="middle">reuse rate · never cited</text>
<path class="line blue" d="M789,390 L789,420" marker-end="url(#h-blue)"/>
<path class="line blue" d="M973,390 L973,420" marker-end="url(#h-blue)"/>
<rect class="skill" x="320" y="420" width="330" height="66" rx="8" stroke-width="1.5"/>
<text class="label" x="485" y="443" text-anchor="middle">/kaizen:learn prune</text>
<text class="sub" x="485" y="458" text-anchor="middle">Keep · Update · Merge · Replace · Delete</text>
<text class="sub" x="485" y="472" text-anchor="middle">with evidence; never touches product code</text>
<path class="line accent dashed" d="M690,453 L650,453" marker-end="url(#h-accent)"/>
<rect class="pill" x="631.45" y="464" width="77.1" height="17" rx="4"/>
<text class="edge" x="670" y="475" text-anchor="middle">never cited</text>
<path class="line blue dashed" d="M485,420 L485,288" marker-end="url(#h-blue)"/>
<rect class="agent" x="36" y="530" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="60" y="540">agent-skills command (/kaizen:spec…)</text>
<rect class="skill" x="305.20000000000005" y="530" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="329.20000000000005" y="540">Kaizen skill (setup, learn, metrics, watch)</text>
<rect class="gate" x="617.8000000000001" y="530" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="641.8000000000001" y="540">Kaizen hook or check</text>
<rect class="artifact" x="787.8000000000001" y="530" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="811.8000000000001" y="540">file in your repo</text>
<rect class="state" x="939.2" y="530" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="963.2" y="540">signal</text>
</svg>
