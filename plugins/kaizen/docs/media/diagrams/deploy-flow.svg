<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="t d">
<title id="t">A watched deployment (/kaizen:deploy)</title>
<desc id="d">Your commands, your approval for production, a shared tag, the plan’s signals watched, rollback first when a threshold is breached.</desc>
<style>
  .bg { fill: #fbfaf7; stroke: #e4e0d8; }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 18px; font-weight: 700; }
  .desc { font-size: 12.5px; fill: #5c6370; }
  .label { font-size: 13.5px; font-weight: 600; }
  .t12 { font-size: 12px; }
  .sub { font-size: 11.5px; fill: #5c6370; }
  .small { font-size: 11px; fill: #5c6370; }
  .edge { font-size: 11px; fill: #5c6370; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .skill { fill: #fdf1ea; stroke: #d97757; }
  .artifact { fill: #edf2fb; stroke: #5b7fbf; }
  .gate { fill: #fdeeee; stroke: #c94a4a; }
  .agent { fill: #ecf6ef; stroke: #3f8f5a; }
  .outside { fill: #f3f0fa; stroke: #7a5fc0; }
  .state { fill: #fff8e1; stroke: #b8901c; }
  .plain { fill: #ffffff; stroke: #c9c4ba; }
  .region { fill: none; stroke: #b9b3a6; stroke-dasharray: 5 4; }
  .regionlabel { font-size: 11.5px; font-weight: 600; fill: #7d776b; letter-spacing: .04em; }
  .band { fill: #fff4dd; stroke: #d6a645; }
  .line { fill: none; stroke: #6e7681; stroke-width: 1.6; }
  .line.accent { stroke: #d97757; }
  .line.bad { stroke: #c94a4a; }
  .line.ok { stroke: #3f8f5a; }
  .line.blue { stroke: #5b7fbf; }
  .dashed { stroke-dasharray: 6 4; }
  .head { fill: #6e7681; }
  .head.accent { fill: #d97757; }
  .head.bad { fill: #c94a4a; }
  .head.ok { fill: #3f8f5a; }
  .head.blue { fill: #5b7fbf; }
  .pill { fill: #ffffff; stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161b22; stroke: #30363d; }
    text { fill: #e6edf3; }
    .desc, .sub, .small, .edge { fill: #9aa4b0; }
    .skill { fill: #3a2419; stroke: #e08b6c; }
    .artifact { fill: #1b2638; stroke: #7c9fd8; }
    .gate { fill: #3a1d1f; stroke: #e06c6c; }
    .agent { fill: #18301f; stroke: #5fb07a; }
    .outside { fill: #271f3d; stroke: #a08ae0; }
    .state { fill: #33290f; stroke: #d6b043; }
    .plain { fill: #1f2630; stroke: #4a525d; }
    .region { stroke: #5a6270; }
    .regionlabel { fill: #a39d90; }
    .band { fill: #33290f; stroke: #c99a3b; }
    .line { stroke: #9aa4b0; }
    .line.accent { stroke: #e08b6c; }
    .line.bad { stroke: #e06c6c; }
    .line.ok { stroke: #5fb07a; }
    .line.blue { stroke: #7c9fd8; }
    .head { fill: #9aa4b0; }
    .head.accent { fill: #e08b6c; }
    .head.bad { fill: #e06c6c; }
    .head.ok { fill: #5fb07a; }
    .head.blue { fill: #7c9fd8; }
    .pill { fill: #161b22; }
  }
</style>
<defs><marker id="h-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1099" height="619" rx="14"/>
<text class="title" x="28" y="38">A watched deployment (/kaizen:deploy)</text>
<text class="desc" x="28" y="58">Your commands, your approval for production, a shared tag, the plan’s signals watched, rollback first when a threshold is breached.</text>
<rect class="gate" x="36" y="90" width="250" height="112" rx="8" stroke-width="1.5"/>
<text class="label" x="161" y="122" text-anchor="middle">Preconditions</text>
<text class="sub" x="161" y="137" text-anchor="middle">merged commit, CI green</text>
<text class="sub" x="161" y="151" text-anchor="middle">shipped plans: rollback + signal</text>
<text class="sub" x="161" y="165" text-anchor="middle">rollback declared for the env</text>
<text class="sub" x="161" y="179" text-anchor="middle">signals already healthy</text>
<rect class="skill" x="320" y="90" width="230" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="435" y="115" text-anchor="middle">deploy request &lt;env&gt;</text>
<text class="sub" x="435" y="130" text-anchor="middle" style="font-size:11.2px">protected env: 6-char code, 30 min</text>
<rect class="outside" x="320" y="166" width="230" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="435" y="191" text-anchor="middle" style="font-size:12.9px">you: kaizen deploy 7C1E0B</text>
<text class="sub" x="435" y="206" text-anchor="middle">UserPromptSubmit approves</text>
<rect class="skill" x="584" y="90" width="230" height="70" rx="8" stroke-width="1.5"/>
<text class="label" x="699" y="115" text-anchor="middle">deploy run &lt;env&gt;</text>
<text class="sub" x="699" y="130" text-anchor="middle">your command with KAIZEN_ENV,</text>
<text class="sub" x="699" y="144" text-anchor="middle">KAIZEN_REF, KAIZEN_SHA · timeout</text>
<rect class="artifact" x="848" y="90" width="216" height="70" rx="8" stroke-width="1.5"/>
<text class="label" x="956" y="115" text-anchor="middle">deploy/&lt;env&gt;/&lt;stamp&gt;</text>
<text class="sub" x="956" y="130" text-anchor="middle">annotated tag on the commit,</text>
<text class="sub" x="956" y="144" text-anchor="middle">pushed (deploy.push_tags)</text>
<path class="line accent" d="M286,123.6 L320,118" marker-end="url(#h-accent)"/>
<path class="line" d="M435,146 L435,166" marker-end="url(#h-default)"/>
<path class="line accent" d="M550,194 L567,194 L567,125 L584,125" marker-end="url(#h-accent)"/>
<path class="line accent" d="M814,125 L848,125" marker-end="url(#h-accent)"/>
<rect class="gate" x="584" y="250" width="230" height="78" rx="8" stroke-width="1.5"/>
<text class="label" x="699" y="272" text-anchor="middle">monitor watch</text>
<text class="sub" x="699" y="287" text-anchor="middle">watch_minutes (15) · every</text>
<text class="sub" x="699" y="301" text-anchor="middle">interval_seconds (60) · breach =</text>
<text class="sub" x="699" y="315" text-anchor="middle">consecutive (2) red samples</text>
<path class="line accent" d="M956,160 L956,230 L699,230 L699,250" marker-end="url(#h-accent)"/>
<rect class="plain" x="848" y="250" width="216" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="956" y="275" text-anchor="middle">✔ healthy</text>
<text class="sub" x="956" y="290" text-anchor="middle">nothing to do</text>
<path class="line ok" d="M814,273.4 L848,278" marker-end="url(#h-ok)"/>
<rect class="artifact" x="584" y="370" width="230" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="699" y="395" text-anchor="middle" style="font-size:12.9px">incident/&lt;env&gt;/&lt;detected&gt;</text>
<text class="sub" x="699" y="410" text-anchor="middle">opened at detection</text>
<rect class="skill" x="320" y="370" width="230" height="76" rx="8" stroke-width="1.5"/>
<text class="label" x="435" y="391" text-anchor="middle">deploy rollback &lt;env&gt;</text>
<text class="sub" x="435" y="406" text-anchor="middle">no approval needed · automatic</text>
<text class="sub" x="435" y="420" text-anchor="middle" style="font-size:11.2px">if deploy.auto_rollback · target =</text>
<text class="sub" x="435" y="434" text-anchor="middle">previous successful deploy</text>
<rect class="artifact" x="36" y="370" width="250" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="161" y="395" text-anchor="middle">rollback/&lt;env&gt;/&lt;stamp&gt;</text>
<text class="sub" x="161" y="410" text-anchor="middle">resolves the incident</text>
<rect class="skill" x="36" y="470" width="250" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="161" y="495" text-anchor="middle">/kaizen:postmortem</text>
<text class="sub" x="161" y="510" text-anchor="middle">timeline from the tags</text>
<path class="line bad" d="M699,328 L699,370" marker-end="url(#h-bad)"/>
<rect class="pill" x="702" y="342" width="46.599999999999994" height="17" rx="4"/>
<text class="edge" x="707" y="353" text-anchor="start">breach</text>
<path class="line bad" d="M584,398 L550,392.8" marker-end="url(#h-bad)"/>
<path class="line bad" d="M320,392.8 L286,398" marker-end="url(#h-bad)"/>
<path class="line blue" d="M161,426 L161,470" marker-end="url(#h-blue)"/>
<rect class="skill" x="848" y="370" width="216" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="956" y="395" text-anchor="middle">deploy flag on|off</text>
<text class="sub" x="956" y="410" text-anchor="middle">your feature flag commands</text>
<rect class="gate" x="320" y="470" width="494" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="567" y="495" text-anchor="middle" style="font-size:12.7px">PreToolUse: the raw command of a protected env is refused</text>
<text class="sub" x="567" y="510" text-anchor="middle">and so are hand-made deploy/ rollback/ incident/ resolve/ tags</text>
<text class="small" x="36" y="566" text-anchor="start">Thresholds: a shipped plan’s Signal (`error_rate` &gt; 1 %) overrides monitor.signals for that deployment. Every deploy, rollback, incident and resolve tag</text>
<text class="small" x="36" y="581" text-anchor="start">feeds real DORA metrics (frequency, lead time to production, failure rate, time to restore). Deployment state is uncertain after a timeout: check before retrying.</text>
<rect class="skill" x="36" y="596" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="60" y="606">skill (/kaizen:…)</text>
<rect class="artifact" x="187.4" y="596" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="211.4" y="606">file in your repo</text>
<rect class="gate" x="338.8" y="596" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="362.8" y="606">deterministic gate</text>
<rect class="outside" x="496.40000000000003" y="596" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="520.4000000000001" y="606">you / outside world</text>
</svg>
