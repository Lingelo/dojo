<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="t d">
<title id="t">Incidents: detection, resolution, learning</title>
<desc id="d">An incident is a dated git tag, so time to restore and postmortem timelines are measured, not remembered.</desc>
<style>
  .bg { fill: #fbfaf7; stroke: #e4e0d8; }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 18px; font-weight: 700; }
  .desc { font-size: 12.5px; fill: #5c6370; }
  .label { font-size: 13.5px; font-weight: 600; }
  .t12 { font-size: 12px; }
  .sub { font-size: 11.5px; fill: #5c6370; }
  .small { font-size: 11px; fill: #5c6370; }
  .edge { font-size: 11px; fill: #5c6370; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .skill { fill: #fdf1ea; stroke: #d97757; }
  .artifact { fill: #edf2fb; stroke: #5b7fbf; }
  .gate { fill: #fdeeee; stroke: #c94a4a; }
  .agent { fill: #ecf6ef; stroke: #3f8f5a; }
  .outside { fill: #f3f0fa; stroke: #7a5fc0; }
  .state { fill: #fff8e1; stroke: #b8901c; }
  .plain { fill: #ffffff; stroke: #c9c4ba; }
  .region { fill: none; stroke: #b9b3a6; stroke-dasharray: 5 4; }
  .regionlabel { font-size: 11.5px; font-weight: 600; fill: #7d776b; letter-spacing: .04em; }
  .band { fill: #fff4dd; stroke: #d6a645; }
  .line { fill: none; stroke: #6e7681; stroke-width: 1.6; }
  .line.accent { stroke: #d97757; }
  .line.bad { stroke: #c94a4a; }
  .line.ok { stroke: #3f8f5a; }
  .line.blue { stroke: #5b7fbf; }
  .dashed { stroke-dasharray: 6 4; }
  .head { fill: #6e7681; }
  .head.accent { fill: #d97757; }
  .head.bad { fill: #c94a4a; }
  .head.ok { fill: #3f8f5a; }
  .head.blue { fill: #5b7fbf; }
  .pill { fill: #ffffff; stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161b22; stroke: #30363d; }
    text { fill: #e6edf3; }
    .desc, .sub, .small, .edge { fill: #9aa4b0; }
    .skill { fill: #3a2419; stroke: #e08b6c; }
    .artifact { fill: #1b2638; stroke: #7c9fd8; }
    .gate { fill: #3a1d1f; stroke: #e06c6c; }
    .agent { fill: #18301f; stroke: #5fb07a; }
    .outside { fill: #271f3d; stroke: #a08ae0; }
    .state { fill: #33290f; stroke: #d6b043; }
    .plain { fill: #1f2630; stroke: #4a525d; }
    .region { stroke: #5a6270; }
    .regionlabel { fill: #a39d90; }
    .band { fill: #33290f; stroke: #c99a3b; }
    .line { stroke: #9aa4b0; }
    .line.accent { stroke: #e08b6c; }
    .line.bad { stroke: #e06c6c; }
    .line.ok { stroke: #5fb07a; }
    .line.blue { stroke: #7c9fd8; }
    .head { fill: #9aa4b0; }
    .head.accent { fill: #e08b6c; }
    .head.bad { fill: #e06c6c; }
    .head.ok { fill: #5fb07a; }
    .head.blue { fill: #7c9fd8; }
    .pill { fill: #161b22; }
  }
</style>
<defs><marker id="h-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1099" height="519" rx="14"/>
<text class="title" x="28" y="38">Incidents: detection, resolution, learning</text>
<text class="desc" x="28" y="58">An incident is a dated git tag, so time to restore and postmortem timelines are measured, not remembered.</text>
<rect class="skill" x="36" y="86" width="250" height="62" rx="8" stroke-width="1.5"/>
<text class="label" x="161" y="114" text-anchor="middle">monitor watch</text>
<text class="sub" x="161" y="129" text-anchor="middle">after a deployment</text>
<rect class="skill" x="36" y="168" width="250" height="62" rx="8" stroke-width="1.5"/>
<text class="label" x="161" y="196" text-anchor="middle">monitor patrol --env e</text>
<text class="sub" x="161" y="211" text-anchor="middle">scheduled: routine, cron, CI</text>
<rect class="skill" x="36" y="250" width="250" height="62" rx="8" stroke-width="1.5"/>
<text class="label" x="161" y="271" text-anchor="middle">monitor alert</text>
<text class="sub" x="161" y="286" text-anchor="middle">Alertmanager · PagerDuty ·</text>
<text class="sub" x="161" y="300" text-anchor="middle">Datadog · plain JSON</text>
<rect class="skill" x="36" y="332" width="250" height="62" rx="8" stroke-width="1.5"/>
<text class="label" x="161" y="360" text-anchor="middle">monitor incident open</text>
<text class="sub" x="161" y="375" text-anchor="middle">by hand, --at, --summary</text>
<rect class="artifact" x="360" y="190" width="270" height="96" rx="8" stroke-width="1.5"/>
<text class="label" x="495" y="221" text-anchor="middle">incident/&lt;env&gt;/&lt;detected&gt;</text>
<text class="sub" x="495" y="236" text-anchor="middle">on the commit live at detection</text>
<text class="sub" x="495" y="250" text-anchor="middle">idempotent while one is open</text>
<text class="sub" x="495" y="264" text-anchor="middle">note: source · summary · signals</text>
<path class="line bad" d="M286,117 L360,209.2" marker-end="url(#h-bad)"/>
<path class="line bad" d="M286,199 L360,228.4" marker-end="url(#h-bad)"/>
<path class="line bad" d="M286,281 L360,247.60000000000002" marker-end="url(#h-bad)"/>
<path class="line bad" d="M286,363 L360,266.8" marker-end="url(#h-bad)"/>
<rect class="skill" x="700" y="110" width="364" height="62" rx="8" stroke-width="1.5"/>
<text class="label" x="882" y="138" text-anchor="middle">deploy rollback &lt;env&gt;</text>
<text class="sub" x="882" y="153" text-anchor="middle">rollback/&lt;env&gt;/… resolves the open incident</text>
<rect class="skill" x="700" y="196" width="364" height="62" rx="8" stroke-width="1.5"/>
<text class="label" x="882" y="224" text-anchor="middle">monitor incident resolve · resolved alert</text>
<text class="sub" x="882" y="239" text-anchor="middle">resolve/&lt;env&gt;/… (never before detection)</text>
<path class="line ok" d="M630,218.8 L700,141" marker-end="url(#h-ok)"/>
<path class="line ok" d="M630,247.6 L700,227" marker-end="url(#h-ok)"/>
<rect class="region" x="360" y="330" width="704" height="150" rx="12"/>
<text class="regionlabel" x="372" y="347">WHO READS THE INCIDENT TAGS</text>
<rect class="skill" x="376" y="360" width="212" height="96" rx="8" stroke-width="1.5"/>
<text class="label" x="482" y="398" text-anchor="middle">metrics</text>
<text class="sub" x="482" y="413" text-anchor="middle">failure rate · time to restore</text>
<text class="sub" x="482" y="427" text-anchor="middle">(detection → resolution)</text>
<rect class="skill" x="604" y="360" width="212" height="96" rx="8" stroke-width="1.5"/>
<text class="label" x="710" y="398" text-anchor="middle">postmortem</text>
<text class="sub" x="710" y="413" text-anchor="middle">timeline: real start,</text>
<text class="sub" x="710" y="427" text-anchor="middle">detection, mitigation</text>
<rect class="skill" x="832" y="360" width="212" height="96" rx="8" stroke-width="1.5"/>
<text class="label" x="938" y="398" text-anchor="middle">status / help</text>
<text class="sub" x="938" y="413" text-anchor="middle">open incident first, then a</text>
<text class="sub" x="938" y="427" text-anchor="middle">resolved one without postmortem</text>
<path class="line blue" d="M495,286 L495,330" marker-end="url(#h-blue)"/>
<text class="small" x="36" y="426" text-anchor="start">Alert time wins over reception time.</text>
<text class="small" x="36" y="441" text-anchor="start">--env wins over the alert’s env label.</text>
<text class="small" x="36" y="456" text-anchor="start">A resolution older than the detection</text>
<text class="small" x="36" y="471" text-anchor="start">is moved to the detection time.</text>
<rect class="skill" x="36" y="496" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="60" y="506">skill (/kaizen:…)</text>
<rect class="artifact" x="187.4" y="496" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="211.4" y="506">file in your repo</text>
</svg>
