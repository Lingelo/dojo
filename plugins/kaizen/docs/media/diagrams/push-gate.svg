  .regionlabel { font-size: 11.5px; font-weight: 600; fill: #7d776b; letter-spacing: .04em; }
  .band { fill: #fff4dd; stroke: #d6a645; }
  .line { fill: none; stroke: #6e7681; stroke-width: 1.6; }
  .line.accent { stroke: #d97757; }
  .line.bad { stroke: #c94a4a; }
  .line.ok { stroke: #3f8f5a; }
  .line.blue { stroke: #5b7fbf; }
  .dashed { stroke-dasharray: 6 4; }
  .head { fill: #6e7681; }
  .head.accent { fill: #d97757; }
  .head.bad { fill: #c94a4a; }
  .head.ok { fill: #3f8f5a; }
  .head.blue { fill: #5b7fbf; }
  .pill { fill: #ffffff; stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161b22; stroke: #30363d; }
    text { fill: #e6edf3; }
    .desc, .sub, .small, .edge { fill: #9aa4b0; }
    .skill { fill: #3a2419; stroke: #e08b6c; }
    .artifact { fill: #1b2638; stroke: #7c9fd8; }
    .gate { fill: #3a1d1f; stroke: #e06c6c; }
    .agent { fill: #18301f; stroke: #5fb07a; }
    .outside { fill: #271f3d; stroke: #a08ae0; }
    .state { fill: #33290f; stroke: #d6b043; }
    .plain { fill: #1f2630; stroke: #4a525d; }
    .region { stroke: #5a6270; }
    .regionlabel { fill: #a39d90; }
    .band { fill: #33290f; stroke: #c99a3b; }
    .line { stroke: #9aa4b0; }
    .line.accent { stroke: #e08b6c; }
    .line.bad { stroke: #e06c6c; }
    .line.ok { stroke: #5fb07a; }
    .line.blue { stroke: #7c9fd8; }
    .head { fill: #9aa4b0; }
    .head.accent { fill: #e08b6c; }
    .head.bad { fill: #e06c6c; }
    .head.ok { fill: #5fb07a; }
    .head.blue { fill: #7c9fd8; }
    .pill { fill: #161b22; }
  }
</style>
<defs><marker id="h-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1099" height="639" rx="14"/>
<text class="title" x="28" y="38">The review required before git push</text>
<text class="desc" x="28" y="58">A PreToolUse hook refuses the push until a review recorded the pushed tree. Evidence comes from hooks, not from the agent’s word.</text>
<rect class="region" x="28" y="76" width="330" height="520" rx="12"/>
<text class="regionlabel" x="40" y="93">RECORDING A REVIEW</text>
<rect class="skill" x="44" y="106" width="298" height="52" rx="8" stroke-width="1.5"/>
<text class="label" x="193" y="129" text-anchor="middle">/kaizen:review</text>
<text class="sub" x="193" y="144" text-anchor="middle">launches reviewers through the Agent tool</text>
<rect class="gate" x="44" y="186" width="298" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="193" y="211" text-anchor="middle">PostToolUse --evidence</text>
<text class="sub" x="193" y="226" text-anchor="middle" style="font-size:11.2px">logs each kaizen:*-reviewer actually launched</text>
<rect class="state" x="44" y="270" width="298" height="46" rx="10" stroke-width="1.5"/>
<text class="label" x="193" y="297" text-anchor="middle">review-evidence.json</text>
<rect class="gate" x="44" y="344" width="298" height="70" rx="8" stroke-width="1.5"/>
<text class="label" x="193" y="362" text-anchor="middle">review record --verdict</text>
<text class="sub" x="193" y="377" text-anchor="middle" style="font-size:10.3px">refused without a reviewer since the last review,</text>
<text class="sub" x="193" y="391" text-anchor="middle">except light (branch ≤ 20 lines)</text>
<text class="sub" x="193" y="405" text-anchor="middle">or update after fixes (≤ 80 lines since)</text>
<rect class="state" x="44" y="442" width="298" height="66" rx="10" stroke-width="1.5"/>
<text class="label" x="193" y="465" text-anchor="middle">reviews.json[branch]</text>
<text class="sub" x="193" y="480" text-anchor="middle" style="font-size:11.4px">tree · head · verdict ready|concerns|blocked</text>
<text class="sub" x="193" y="494" text-anchor="middle" style="font-size:10.9px">depth agents|light|update · reviewers · models</text>
<path class="line accent" d="M193,158 L193,186" marker-end="url(#h-accent)"/>
<path class="line bad" d="M193,242 L193,270" marker-end="url(#h-bad)"/>
<path class="line" d="M193,316 L193,344" marker-end="url(#h-default)"/>
<path class="line bad" d="M193,414 L193,442" marker-end="url(#h-bad)"/>
<text class="small" x="44" y="540" text-anchor="start">Direct writes to these state files and hand-made</text>
<text class="small" x="44" y="555" text-anchor="start">deploy/ rollback/ incident/ resolve/ tags are refused.</text>
<rect class="outside" x="396" y="96" width="300" height="50" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="125" text-anchor="middle">git push (any Bash command)</text>
<rect class="gate" x="396" y="176" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="202" text-anchor="middle">require_before_push: false?</text>
<rect class="gate" x="396" y="238" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="264" text-anchor="middle">default branch or no new code?</text>
<rect class="gate" x="396" y="300" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="326" text-anchor="middle">no review recorded?</text>
<rect class="gate" x="396" y="362" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="388" text-anchor="middle">reviewed tree not found?</text>
<rect class="gate" x="396" y="424" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="450" text-anchor="middle">blocked and unchanged since?</text>
<rect class="gate" x="396" y="486" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="512" text-anchor="middle">&gt; 80 lines since the review?</text>
<path class="line" d="M546,146 L546,176" marker-end="url(#h-default)"/>
<rect class="pill" x="549" y="154" width="144.2" height="17" rx="4"/>
<text class="edge" x="554" y="165" text-anchor="start">PreToolUse review-gate</text>
<path class="line" d="M546,220 L546,238" marker-end="url(#h-default)"/>
<path class="line" d="M546,282 L546,300" marker-end="url(#h-default)"/>
<path class="line" d="M546,344 L546,362" marker-end="url(#h-default)"/>
<path class="line" d="M546,406 L546,424" marker-end="url(#h-default)"/>
<path class="line" d="M546,468 L546,486" marker-end="url(#h-default)"/>
<path class="line ok" d="M696,198 L748,198" marker-end="url(#h-ok)"/>
<rect class="pill" x="703.75" y="181" width="40.5" height="17" rx="4"/>
<text class="edge" x="724" y="192" text-anchor="middle">allow</text>
<path class="line ok" d="M696,260 L748,260" marker-end="url(#h-ok)"/>
<rect class="pill" x="703.75" y="243" width="40.5" height="17" rx="4"/>
<text class="edge" x="724" y="254" text-anchor="middle">allow</text>
<path class="line bad" d="M696,322 L748,322" marker-end="url(#h-bad)"/>
<rect class="pill" x="700.7" y="305" width="46.599999999999994" height="17" rx="4"/>
<text class="edge" x="724" y="316" text-anchor="middle">refuse</text>
<path class="line bad" d="M696,384 L748,384" marker-end="url(#h-bad)"/>
<rect class="pill" x="700.7" y="367" width="46.599999999999994" height="17" rx="4"/>
<text class="edge" x="724" y="378" text-anchor="middle">refuse</text>
<path class="line bad" d="M696,446 L748,446" marker-end="url(#h-bad)"/>
<rect class="pill" x="700.7" y="429" width="46.599999999999994" height="17" rx="4"/>
<text class="edge" x="724" y="440" text-anchor="middle">refuse</text>
<path class="line bad" d="M696,508 L748,508" marker-end="url(#h-bad)"/>
<rect class="pill" x="700.7" y="491" width="46.599999999999994" height="17" rx="4"/>
<text class="edge" x="724" y="502" text-anchor="middle">refuse</text>
<rect class="plain" x="396" y="556" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="582" text-anchor="middle">otherwise: push allowed ✔</text>
<path class="line ok" d="M546,530 L546,556" marker-end="url(#h-ok)"/>
<path class="line blue dashed" d="M342,475 L374,475 L374,300 L396,322" marker-end="url(#h-blue)"/>
<rect class="pill" x="356.8" y="381" width="34.4" height="17" rx="4"/>
<text class="edge" x="374" y="392" text-anchor="middle">read</text>
<rect class="region" x="760" y="76" width="312" height="520" rx="12"/>
<text class="regionlabel" x="772" y="93">WAIVER: ONLY YOU CAN GRANT IT</text>
<rect class="outside" x="776" y="106" width="280" height="46" rx="8" stroke-width="1.5"/>
<text class="label" x="916" y="133" text-anchor="middle">you ask to skip the review</text>
<rect class="skill" x="776" y="176" width="280" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="916" y="201" text-anchor="middle">review waive --reason "…"</text>
<text class="sub" x="916" y="216" text-anchor="middle">prints a 6-character code (30 min)</text>
<rect class="state" x="776" y="256" width="280" height="46" rx="10" stroke-width="1.5"/>
<text class="label" x="916" y="283" text-anchor="middle">waivers.json (pending)</text>
<rect class="outside" x="776" y="326" width="280" height="52" rx="8" stroke-width="1.5"/>
<text class="label" x="916" y="349" text-anchor="middle">you type: kaizen waive 3F9A2C</text>
<text class="sub" x="916" y="364" text-anchor="middle">Claude cannot type it for you</text>
<rect class="gate" x="776" y="402" width="280" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="916" y="427" text-anchor="middle">UserPromptSubmit --confirm</text>
<text class="sub" x="916" y="442" text-anchor="middle">only a user message reaches this hook</text>
<rect class="state" x="776" y="482" width="280" height="62" rx="10" stroke-width="1.5"/>
<text class="label" x="916" y="503" text-anchor="middle">reviews.json: verdict waived</text>
<text class="sub" x="916" y="518" text-anchor="middle">push allowed · the PR gets a</text>
<text class="sub" x="916" y="532" text-anchor="middle">“Review waived” section</text>
<path class="line" d="M916,152 L916,176" marker-end="url(#h-default)"/>
<path class="line" d="M916,232 L916,256" marker-end="url(#h-default)"/>
<path class="line" d="M916,302 L916,326" marker-end="url(#h-default)"/>
<path class="line accent" d="M916,378 L916,402" marker-end="url(#h-accent)"/>
<path class="line bad" d="M916,458 L916,482" marker-end="url(#h-bad)"/>
<rect class="skill" x="36" y="612" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="60" y="622">skill (/kaizen:…)</text>
<rect class="artifact" x="187.4" y="612" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="211.4" y="622">file in your repo</text>
<rect class="gate" x="338.8" y="612" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="362.8" y="622">deterministic gate</text>
<rect class="outside" x="496.40000000000003" y="612" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="520.4000000000001" y="622">you / outside world</text>
<rect class="state" x="660.2" y="612" width="18" height="12" rx="3" stroke-width="1.3"/>
<text class="small" x="684.2" y="622">state in .kaizen/state/</text>
</svg>
