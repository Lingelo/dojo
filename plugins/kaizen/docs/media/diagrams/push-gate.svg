<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d">
<title id="t">The review required before git push</title>
<desc id="d">agent-skills reviews; Kaizen records the tree it reviewed and the verdict it wrote. A PreToolUse hook stops an unreviewed push, or you choose to skip it.</desc>
<style>
  .bg { fill: #fbfaf7; stroke: #e4e0d8; }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 18px; font-weight: 700; }
  .desc { font-size: 12.5px; fill: #5c6370; }
  .label { font-size: 13.5px; font-weight: 600; }
  .t12 { font-size: 12px; }
  .sub { font-size: 11.5px; fill: #5c6370; }
  .small { font-size: 11px; fill: #5c6370; }
  .edge { font-size: 11px; fill: #5c6370; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .skill { fill: #fdf1ea; stroke: #d97757; }
  .artifact { fill: #edf2fb; stroke: #5b7fbf; }
  .gate { fill: #fdeeee; stroke: #c94a4a; }
  .agent { fill: #ecf6ef; stroke: #3f8f5a; }
  .outside { fill: #f3f0fa; stroke: #7a5fc0; }
  .state { fill: #fff8e1; stroke: #b8901c; }
  .plain { fill: #ffffff; stroke: #c9c4ba; }
  .region { fill: none; stroke: #b9b3a6; stroke-dasharray: 5 4; }
  .regionlabel { font-size: 11.5px; font-weight: 600; fill: #7d776b; letter-spacing: .04em; }
  .band { fill: #fff4dd; stroke: #d6a645; }
  .line { fill: none; stroke: #6e7681; stroke-width: 1.6; }
  .line.accent { stroke: #d97757; }
  .line.bad { stroke: #c94a4a; }
  .line.ok { stroke: #3f8f5a; }
  .line.blue { stroke: #5b7fbf; }
  .dashed { stroke-dasharray: 6 4; }
  .head { fill: #6e7681; }
  .head.accent { fill: #d97757; }
  .head.bad { fill: #c94a4a; }
  .head.ok { fill: #3f8f5a; }
  .head.blue { fill: #5b7fbf; }
  .pill { fill: #ffffff; stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161b22; stroke: #30363d; }
    text { fill: #e6edf3; }
    .desc, .sub, .small, .edge { fill: #9aa4b0; }
    .skill { fill: #3a2419; stroke: #e08b6c; }
    .artifact { fill: #1b2638; stroke: #7c9fd8; }
    .gate { fill: #3a1d1f; stroke: #e06c6c; }
    .agent { fill: #18301f; stroke: #5fb07a; }
    .outside { fill: #271f3d; stroke: #a08ae0; }
    .state { fill: #33290f; stroke: #d6b043; }
    .plain { fill: #1f2630; stroke: #4a525d; }
    .region { stroke: #5a6270; }
    .regionlabel { fill: #a39d90; }
    .band { fill: #33290f; stroke: #c99a3b; }
    .line { stroke: #9aa4b0; }
    .line.accent { stroke: #e08b6c; }
    .line.bad { stroke: #e06c6c; }
    .line.ok { stroke: #5fb07a; }
    .line.blue { stroke: #7c9fd8; }
    .head { fill: #9aa4b0; }
    .head.accent { fill: #e08b6c; }
    .head.bad { fill: #e06c6c; }
    .head.ok { fill: #5fb07a; }
    .head.blue { fill: #7c9fd8; }
    .pill { fill: #161b22; }
  }
</style>
<defs><marker id="h-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1099" height="639" rx="14"/>
<text class="title" x="28" y="38">The review required before git push</text>
<text class="desc" x="28" y="58">agent-skills reviews; Kaizen records the tree it reviewed and the verdict it wrote. A PreToolUse hook stops an unreviewed push, or you choose to skip it.</text>
<rect class="region" x="28" y="76" width="330" height="520" rx="12"/>
<text class="regionlabel" x="40" y="93">THE REVIEW RECORDS ITSELF</text>
<rect class="agent" x="44" y="106" width="140" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="114" y="126" text-anchor="middle">/review</text>
<text class="sub" x="114" y="141" text-anchor="middle">skill, in the</text>
<text class="sub" x="114" y="155" text-anchor="middle">conversation</text>
<rect class="agent" x="202" y="106" width="140" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="272" y="126" text-anchor="middle">/ship</text>
<text class="sub" x="272" y="141" text-anchor="middle">code-reviewer</text>
<text class="sub" x="272" y="155" text-anchor="middle">persona</text>
<rect class="gate" x="44" y="196" width="140" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="114" y="218" text-anchor="middle" style="font-size:10.8px">PostToolUse Skill</text>
<text class="sub" x="114" y="233" text-anchor="middle">leaves a mark</text>
<text class="sub" x="114" y="247" text-anchor="middle" style="font-size:11.4px">review-pending.json</text>
<rect class="gate" x="44" y="290" width="140" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="114" y="312" text-anchor="middle">Stop --stop</text>
<text class="sub" x="114" y="327" text-anchor="middle">reads the turn’s</text>
<text class="sub" x="114" y="341" text-anchor="middle">last message</text>
<rect class="gate" x="202" y="196" width="140" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="272" y="218" text-anchor="middle" style="font-size:10.8px">PostToolUse Agent</text>
<text class="sub" x="272" y="233" text-anchor="middle">reads the</text>
<text class="sub" x="272" y="247" text-anchor="middle">persona’s return</text>
<path class="line accent" d="M114,166 L114,196" marker-end="url(#h-accent)"/>
<path class="line" d="M114,260 L114,290" marker-end="url(#h-default)"/>
<path class="line accent" d="M272,166 L272,196" marker-end="url(#h-accent)"/>
<rect class="plain" x="44" y="384" width="298" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="193" y="406" text-anchor="middle">verdict</text>
<text class="sub" x="193" y="421" text-anchor="middle">Critical finding → blocked</text>
<text class="sub" x="193" y="435" text-anchor="middle" style="font-size:10.5px">Verdict: REQUEST CHANGES → concerns · else ready</text>
<path class="line" d="M114,354 L114,384" marker-end="url(#h-default)"/>
<path class="line" d="M272,260 L272,384" marker-end="url(#h-default)"/>
<rect class="state" x="44" y="476" width="298" height="66" rx="10" stroke-width="1.5"/>
<text class="label" x="193" y="506" text-anchor="middle">reviews.json[branch]</text>
<text class="sub" x="193" y="521" text-anchor="middle">tree · head · verdict · reviewer</text>
<path class="line bad" d="M193,448 L193,476" marker-end="url(#h-bad)"/>
<text class="small" x="44" y="568" text-anchor="start">Direct writes to these state files are refused.</text>
<rect class="outside" x="396" y="96" width="300" height="50" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="125" text-anchor="middle">git push (any spelling)</text>
<rect class="gate" x="396" y="176" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="202" text-anchor="middle">require_before_push: false?</text>
<rect class="gate" x="396" y="238" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="264" text-anchor="middle">default branch or no new code?</text>
<rect class="gate" x="396" y="300" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="326" text-anchor="middle">no review recorded?</text>
<rect class="gate" x="396" y="362" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="388" text-anchor="middle">reviewed tree not found?</text>
<rect class="gate" x="396" y="424" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="450" text-anchor="middle">blocked and unchanged since?</text>
<rect class="gate" x="396" y="486" width="300" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="546" y="512" text-anchor="middle">&gt; 80 lines since the review?</text>
