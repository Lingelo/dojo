<text class="edge" x="374" y="420" text-anchor="middle">read</text>
<rect class="region" x="760" y="76" width="312" height="520" rx="12"/>
<text class="regionlabel" x="772" y="93">SKIPPING IT: ONLY YOU DECIDE</text>
<rect class="outside" x="776" y="106" width="280" height="46" rx="8" stroke-width="1.5"/>
<text class="label" x="916" y="133" text-anchor="middle">stop: Claude asks you</text>
