<text class="label" x="916" y="201" text-anchor="middle" style="font-size:12.9px">1. Run the review (Recommended)</text>
<text class="sub" x="916" y="216" text-anchor="middle">2. Push without a review</text>
<rect class="state" x="776" y="256" width="280" height="46" rx="10" stroke-width="1.5"/>
