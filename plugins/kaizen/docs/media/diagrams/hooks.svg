<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="t d">
<title id="t">Kaizen’s hooks in a Claude Code session</title>
<desc id="d">Five hook registrations make the important rules deterministic. They are inactive outside a Kaizen repo and never block on their own errors.</desc>
<style>
  .bg { fill: #fbfaf7; stroke: #e4e0d8; }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 18px; font-weight: 700; }
  .desc { font-size: 12.5px; fill: #5c6370; }
  .label { font-size: 13.5px; font-weight: 600; }
  .t12 { font-size: 12px; }
  .sub { font-size: 11.5px; fill: #5c6370; }
  .small { font-size: 11px; fill: #5c6370; }
  .edge { font-size: 11px; fill: #5c6370; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .skill { fill: #fdf1ea; stroke: #d97757; }
  .artifact { fill: #edf2fb; stroke: #5b7fbf; }
  .gate { fill: #fdeeee; stroke: #c94a4a; }
  .agent { fill: #ecf6ef; stroke: #3f8f5a; }
  .outside { fill: #f3f0fa; stroke: #7a5fc0; }
  .state { fill: #fff8e1; stroke: #b8901c; }
  .plain { fill: #ffffff; stroke: #c9c4ba; }
  .region { fill: none; stroke: #b9b3a6; stroke-dasharray: 5 4; }
  .regionlabel { font-size: 11.5px; font-weight: 600; fill: #7d776b; letter-spacing: .04em; }
  .band { fill: #fff4dd; stroke: #d6a645; }
  .line { fill: none; stroke: #6e7681; stroke-width: 1.6; }
  .line.accent { stroke: #d97757; }
  .line.bad { stroke: #c94a4a; }
  .line.ok { stroke: #3f8f5a; }
  .line.blue { stroke: #5b7fbf; }
  .dashed { stroke-dasharray: 6 4; }
  .head { fill: #6e7681; }
  .head.accent { fill: #d97757; }
  .head.bad { fill: #c94a4a; }
  .head.ok { fill: #3f8f5a; }
  .head.blue { fill: #5b7fbf; }
  .pill { fill: #ffffff; stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161b22; stroke: #30363d; }
    text { fill: #e6edf3; }
    .desc, .sub, .small, .edge { fill: #9aa4b0; }
    .skill { fill: #3a2419; stroke: #e08b6c; }
    .artifact { fill: #1b2638; stroke: #7c9fd8; }
    .gate { fill: #3a1d1f; stroke: #e06c6c; }
    .agent { fill: #18301f; stroke: #5fb07a; }
    .outside { fill: #271f3d; stroke: #a08ae0; }
    .state { fill: #33290f; stroke: #d6b043; }
    .plain { fill: #1f2630; stroke: #4a525d; }
    .region { stroke: #5a6270; }
    .regionlabel { fill: #a39d90; }
    .band { fill: #33290f; stroke: #c99a3b; }
    .line { stroke: #9aa4b0; }
    .line.accent { stroke: #e08b6c; }
    .line.bad { stroke: #e06c6c; }
    .line.ok { stroke: #5fb07a; }
    .line.blue { stroke: #7c9fd8; }
    .head { fill: #9aa4b0; }
    .head.accent { fill: #e08b6c; }
    .head.bad { fill: #e06c6c; }
    .head.ok { fill: #5fb07a; }
    .head.blue { fill: #7c9fd8; }
    .pill { fill: #161b22; }
  }
</style>
<defs><marker id="h-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1099" height="519" rx="14"/>
<text class="title" x="28" y="38">Kaizen’s hooks in a Claude Code session</text>
<text class="desc" x="28" y="58">Five hook registrations make the important rules deterministic. They are inactive outside a Kaizen repo and never block on their own errors.</text>
<text class="regionlabel" x="36" y="114" text-anchor="start">YOU</text>
<path class="line" d="M150,110 L1064,110"/>
<text class="regionlabel" x="36" y="254" text-anchor="start">CLAUDE</text>
<path class="line" d="M150,250 L1064,250"/>
<text class="regionlabel" x="36" y="394" text-anchor="start">END OF TURN</text>
<path class="line" d="M150,390 L1064,390"/>
<rect class="outside" x="170" y="86" width="230" height="48" rx="8" stroke-width="1.5"/>
<text class="label" x="285" y="114" text-anchor="middle">you send a message</text>
<rect class="gate" x="170" y="150" width="230" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="285" y="172" text-anchor="middle">UserPromptSubmit</text>
<text class="sub" x="285" y="187" text-anchor="middle">review-hooks.mjs --confirm</text>
<text class="sub" x="285" y="201" text-anchor="middle">kaizen waive / deploy &lt;code&gt;</text>
<path class="line" d="M285,134 L285,150" marker-end="url(#h-default)"/>
<rect class="gate" x="440" y="214" width="270" height="76" rx="8" stroke-width="1.5"/>
<text class="label" x="575" y="235" text-anchor="middle">PreToolUse</text>
<text class="sub" x="575" y="250" text-anchor="middle">review-gate.mjs: git push without</text>
<text class="sub" x="575" y="264" text-anchor="middle">review, raw protected deploy, forged</text>
<text class="sub" x="575" y="278" text-anchor="middle">tags, writes to review state → exit 2</text>
<rect class="gate" x="740" y="160" width="324" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="902" y="182" text-anchor="middle">PostToolUse (Bash)</text>
<text class="sub" x="902" y="197" text-anchor="middle">quality-gate.mjs --claim: binds the</text>
<text class="sub" x="902" y="211" text-anchor="middle">gate to the session after gate on</text>
<rect class="gate" x="740" y="238" width="324" height="64" rx="8" stroke-width="1.5"/>
<text class="label" x="902" y="260" text-anchor="middle">PostToolUse (Agent / Task)</text>
<text class="sub" x="902" y="275" text-anchor="middle">review-hooks.mjs --evidence: logs</text>
<text class="sub" x="902" y="289" text-anchor="middle">reviewers launched, cycle subagents</text>
<rect class="gate" x="440" y="352" width="270" height="76" rx="8" stroke-width="1.5"/>
<text class="label" x="575" y="373" text-anchor="middle">Stop</text>
<text class="sub" x="575" y="388" text-anchor="middle">quality-gate.mjs: verify while the</text>
<text class="sub" x="575" y="402" text-anchor="middle">gate is on · blocks ≤ 3 times</text>
<text class="sub" x="575" y="416" text-anchor="middle">records tokens</text>
<rect class="plain" x="170" y="230" width="230" height="44" rx="8" stroke-width="1.5"/>
<text class="label" x="285" y="256" text-anchor="middle">Claude calls a tool</text>
<path class="line" d="M285,214 L285,230" marker-end="url(#h-default)"/>
<path class="line" d="M400,252 L440,252" marker-end="url(#h-default)"/>
<path class="line ok" d="M710,236.8 L740,192" marker-end="url(#h-ok)"/>
<rect class="pill" x="662.05" y="197.4" width="125.89999999999999" height="17" rx="4"/>
<text class="edge" x="725" y="208.4" text-anchor="middle">allowed → tool runs</text>
<path class="line ok" d="M710,267.2 L740,270" marker-end="url(#h-ok)"/>
<path class="line dashed" d="M575,290 L575,352" marker-end="url(#h-default)"/>
<rect class="pill" x="578" y="314" width="77.1" height="17" rx="4"/>
<text class="edge" x="583" y="325" text-anchor="start">… turn ends</text>
<text class="small" x="36" y="470" text-anchor="start">Exit 0 = allow, exit 2 = block with the message on stderr (sent back to Claude). UserPromptSubmit and PostToolUse only observe (always exit 0).</text>
<text class="small" x="36" y="485" text-anchor="start">All registrations live in hooks/hooks.json and use ${CLAUDE_PLUGIN_ROOT}; timeouts: PreToolUse 30 s, PostToolUse 10–15 s, Stop 900 s, UserPromptSubmit 30 s.</text>
</svg>
