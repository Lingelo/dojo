<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="t d">
<title id="t">Kaizen’s hooks in a Claude Code session</title>
<desc id="d">Nine hook registrations make the rules deterministic. Only the secret scan runs outside a Kaizen repo, and none blocks on its own errors.</desc>
<style>
  .bg { fill: #fbfaf7; stroke: #e4e0d8; }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 18px; font-weight: 700; }
  .desc { font-size: 12.5px; fill: #5c6370; }
  .label { font-size: 13.5px; font-weight: 600; }
  .t12 { font-size: 12px; }
  .sub { font-size: 11.5px; fill: #5c6370; }
  .small { font-size: 11px; fill: #5c6370; }
  .edge { font-size: 11px; fill: #5c6370; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .skill { fill: #fdf1ea; stroke: #d97757; }
  .artifact { fill: #edf2fb; stroke: #5b7fbf; }
  .gate { fill: #fdeeee; stroke: #c94a4a; }
  .agent { fill: #ecf6ef; stroke: #3f8f5a; }
  .outside { fill: #f3f0fa; stroke: #7a5fc0; }
  .state { fill: #fff8e1; stroke: #b8901c; }
  .plain { fill: #ffffff; stroke: #c9c4ba; }
  .region { fill: none; stroke: #b9b3a6; stroke-dasharray: 5 4; }
  .regionlabel { font-size: 11.5px; font-weight: 600; fill: #7d776b; letter-spacing: .04em; }
  .band { fill: #fff4dd; stroke: #d6a645; }
  .line { fill: none; stroke: #6e7681; stroke-width: 1.6; }
  .line.accent { stroke: #d97757; }
  .line.bad { stroke: #c94a4a; }
  .line.ok { stroke: #3f8f5a; }
  .line.blue { stroke: #5b7fbf; }
  .dashed { stroke-dasharray: 6 4; }
  .head { fill: #6e7681; }
  .head.accent { fill: #d97757; }
  .head.bad { fill: #c94a4a; }
  .head.ok { fill: #3f8f5a; }
  .head.blue { fill: #5b7fbf; }
  .pill { fill: #ffffff; stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161b22; stroke: #30363d; }
    text { fill: #e6edf3; }
    .desc, .sub, .small, .edge { fill: #9aa4b0; }
    .skill { fill: #3a2419; stroke: #e08b6c; }
    .artifact { fill: #1b2638; stroke: #7c9fd8; }
    .gate { fill: #3a1d1f; stroke: #e06c6c; }
    .agent { fill: #18301f; stroke: #5fb07a; }
    .outside { fill: #271f3d; stroke: #a08ae0; }
    .state { fill: #33290f; stroke: #d6b043; }
    .plain { fill: #1f2630; stroke: #4a525d; }
    .region { stroke: #5a6270; }
    .regionlabel { fill: #a39d90; }
    .band { fill: #33290f; stroke: #c99a3b; }
    .line { stroke: #9aa4b0; }
    .line.accent { stroke: #e08b6c; }
    .line.bad { stroke: #e06c6c; }
    .line.ok { stroke: #5fb07a; }
    .line.blue { stroke: #7c9fd8; }
    .head { fill: #9aa4b0; }
    .head.accent { fill: #e08b6c; }
    .head.bad { fill: #e06c6c; }
    .head.ok { fill: #5fb07a; }
    .head.blue { fill: #7c9fd8; }
    .pill { fill: #161b22; }
  }
</style>
<defs><marker id="h-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1099" height="579" rx="14"/>
<text class="title" x="28" y="38">Kaizen’s hooks in a Claude Code session</text>
<text class="desc" x="28" y="58">Nine hook registrations make the rules deterministic. Only the secret scan runs outside a Kaizen repo, and none blocks on its own errors.</text>
<text class="regionlabel" x="36" y="108" text-anchor="start">YOU</text>
<path class="line" d="M150,104 L1064,104"/>
<text class="regionlabel" x="36" y="258" text-anchor="start">CLAUDE</text>
<path class="line" d="M150,254 L1064,254"/>
<text class="regionlabel" x="36" y="434" text-anchor="start">END OF TURN</text>
<path class="line" d="M150,430 L1064,430"/>
<rect class="gate" x="170" y="76" width="230" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="285" y="94" text-anchor="middle">SessionStart</text>
<text class="sub" x="285" y="109" text-anchor="middle">review-hooks.mjs --heartbeat:</text>
<text class="sub" x="285" y="123" text-anchor="middle">hooks-seen.json, read by doctor</text>
<rect class="outside" x="440" y="84" width="270" height="40" rx="8" stroke-width="1.5"/>
<text class="label" x="575" y="108" text-anchor="middle">you send a message</text>
<rect class="gate" x="740" y="76" width="324" height="56" rx="8" stroke-width="1.5"/>
<text class="label" x="902" y="94" text-anchor="middle">UserPromptSubmit</text>
<text class="sub" x="902" y="109" text-anchor="middle">review-hooks.mjs --confirm:</text>
<text class="sub" x="902" y="123" text-anchor="middle">typed codes (approvals: "code")</text>
<path class="line" d="M710,104 L740,104" marker-end="url(#h-default)"/>
<rect class="plain" x="170" y="234" width="230" height="40" rx="8" stroke-width="1.5"/>
<text class="label" x="285" y="258" text-anchor="middle">Claude calls a tool</text>
<rect class="gate" x="440" y="152" width="270" height="82" rx="8" stroke-width="1.5"/>
<text class="label" x="575" y="183" text-anchor="middle">PreToolUse (Bash)</text>
<text class="sub" x="575" y="198" text-anchor="middle">secret-gate.mjs: commit carrying</text>
<text class="sub" x="575" y="212" text-anchor="middle">a secret, --no-verify → 2</text>
<rect class="gate" x="440" y="254" width="270" height="82" rx="8" stroke-width="1.5"/>
<text class="label" x="575" y="285" text-anchor="middle" style="font-size:12.8px">PreToolUse (Bash, Write, Edit)</text>
<text class="sub" x="575" y="300" text-anchor="middle">review-gate.mjs: push without</text>
<text class="sub" x="575" y="314" text-anchor="middle">review, state writes → 2</text>
<rect class="gate" x="740" y="152" width="324" height="82" rx="8" stroke-width="1.5"/>
<text class="label" x="902" y="183" text-anchor="middle">PostToolUse (Write, Edit)</text>
<text class="sub" x="902" y="198" text-anchor="middle">post-edit.mjs: quality gate on when</text>
<text class="sub" x="902" y="212" text-anchor="middle">code is edited · learnings read back</text>
<rect class="gate" x="740" y="254" width="324" height="82" rx="8" stroke-width="1.5"/>
<text class="label" x="902" y="285" text-anchor="middle">PostToolUse (Agent, Task, Skill)</text>
<text class="sub" x="902" y="300" text-anchor="middle">review-hooks.mjs --evidence:</text>
<text class="sub" x="902" y="314" text-anchor="middle">agent-skills’ review recorded</text>
<path class="line dashed" d="M575,124 L575,142 L285,142 L285,234" marker-end="url(#h-default)"/>
<path class="line" d="M400,254 L420,254 L420,193 L440,193" marker-end="url(#h-default)"/>
<path class="line" d="M400,254 L420,254 L420,295 L440,295" marker-end="url(#h-default)"/>
<path class="line ok" d="M710,193 L740,193" marker-end="url(#h-ok)"/>
<path class="line ok" d="M710,295 L740,295" marker-end="url(#h-ok)"/>
<text class="edge" x="740" y="144" text-anchor="start">allowed → the tool runs, then:</text>
<rect class="gate" x="170" y="392" width="270" height="76" rx="8" stroke-width="1.5"/>
<text class="label" x="305" y="420" text-anchor="middle">Stop</text>
<text class="sub" x="305" y="435" text-anchor="middle">quality-gate.mjs: verify while the</text>
<text class="sub" x="305" y="449" text-anchor="middle">gate is on · blocks ≤ 3 times</text>
<rect class="gate" x="460" y="392" width="280" height="76" rx="8" stroke-width="1.5"/>
<text class="label" x="600" y="420" text-anchor="middle">Stop</text>
<text class="sub" x="600" y="435" text-anchor="middle">review-hooks.mjs --stop: the turn</text>
<text class="sub" x="600" y="449" text-anchor="middle">that ran a review → review recorded</text>
<rect class="gate" x="760" y="392" width="304" height="76" rx="8" stroke-width="1.5"/>
<text class="label" x="912" y="420" text-anchor="middle">Stop</text>
<text class="sub" x="912" y="435" text-anchor="middle">ledger-hook.mjs: charges the turn’s</text>
<text class="sub" x="912" y="449" text-anchor="middle">tokens to the work item · never blocks</text>
<text class="small" x="36" y="506" text-anchor="start">Exit 0 = allow, exit 2 = block with the message on stderr (sent back to Claude). SessionStart, UserPromptSubmit, PostToolUse and the ledger only observe.</text>
<text class="small" x="36" y="521" text-anchor="start">All registrations live in hooks/hooks.json and use ${CLAUDE_PLUGIN_ROOT}; timeouts: SessionStart 10 s, PreToolUse 30 s, PostToolUse 15 s,</text>
<text class="small" x="36" y="536" text-anchor="start">Stop 900 s (gate), 15 s (review), 30 s (ledger), UserPromptSubmit 30 s.</text>
</svg>
