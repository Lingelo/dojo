<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="t d">
<title id="t">Quarantine: three natures, three meanings</title>
<desc id="d">kioku undecided shows the nature of each item. Read it before choosing: drop does not mean the same thing for all three.</desc>
<style>
  .bg { fill: #fbfaf7; stroke: #e4e0d8; }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 18px; font-weight: 700; }
  .desc { font-size: 12.5px; fill: #5c6370; }
  .label { font-size: 13.5px; font-weight: 600; }
  .sub { font-size: 11.5px; fill: #5c6370; }
  .small { font-size: 11px; fill: #5c6370; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .step { fill: #fdf1ea; stroke: #d97757; }
  .store { fill: #edf2fb; stroke: #5b7fbf; }
  .gate { fill: #fdeeee; stroke: #c94a4a; }
  .agent { fill: #ecf6ef; stroke: #3f8f5a; }
  .you { fill: #f3f0fa; stroke: #7a5fc0; }
  .state { fill: #fff8e1; stroke: #b8901c; }
  .plain { fill: #ffffff; stroke: #c9c4ba; }
  .closed { fill: #f2f2f2; stroke: #a0a0a0; stroke-dasharray: 4 3; }
  .region { fill: none; stroke: #b9b3a6; stroke-dasharray: 5 4; }
  .regionlabel { font-size: 11.5px; font-weight: 600; fill: #7d776b; letter-spacing: .04em; }
  .band { fill: #fff4dd; stroke: #d6a645; }
  .line { fill: none; stroke: #6e7681; stroke-width: 1.6; }
  .line.accent { stroke: #d97757; }
  .line.bad { stroke: #c94a4a; }
  .line.ok { stroke: #3f8f5a; }
  .line.blue { stroke: #5b7fbf; }
  .line.dashed { stroke-dasharray: 5 4; }
  .head { fill: #6e7681; } .head.accent { fill: #d97757; } .head.bad { fill: #c94a4a; } .head.ok { fill: #3f8f5a; } .head.blue { fill: #5b7fbf; }
  .tick { fill: #3f8f5a; font-weight: 700; } .cross { fill: #c94a4a; font-weight: 700; }
</style>
<defs><marker id="h-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1099" height="559" rx="14"/>
<text class="title" x="28" y="38">Quarantine: three natures, three meanings</text>
<text class="desc" x="28" y="58">kioku undecided shows the nature of each item. Read it before choosing: drop does not mean the same thing for all three.</text>
<text class="regionlabel" x="36" y="98" text-anchor="start">WHERE IT COMES FROM</text>
<text class="regionlabel" x="256" y="98" text-anchor="start">NATURE</text>
<text class="label" x="566" y="98" text-anchor="middle">keep</text>
<text class="label" x="746" y="98" text-anchor="middle">correct</text>
<text class="label" x="946" y="98" text-anchor="middle">drop</text>
<rect class="step" x="36" y="110" width="180" height="60" rx="8" stroke-width="1.5"/>
<text class="label mono" x="126" y="137" text-anchor="middle">kioku promote</text>
<text class="sub" x="126" y="152" text-anchor="middle">verdict hold</text>
<path class="line bad" d="M216,140 L256,140" marker-end="url(#h-bad)"/>
<rect class="gate" x="256" y="110" width="210" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="361" y="137" text-anchor="middle">held</text>
<text class="sub" x="361" y="152" text-anchor="middle">a candidate NOT in gold</text>
<rect class="plain" x="486" y="110" width="170" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="571" y="137" text-anchor="middle">enters gold</text>
<text class="sub" x="571" y="152" text-anchor="middle">juge=utilisateur</text>
<rect class="plain" x="676" y="110" width="170" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="761" y="137" text-anchor="middle">back to .candidats/</text>
<text class="sub" x="761" y="152" text-anchor="middle">rewrite, then the gate</text>
<rect class="gate" x="866" y="110" width="200" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="966" y="137" text-anchor="middle">DELETED</text>
<text class="sub" x="966" y="152" text-anchor="middle">the candidate is gone</text>
<rect class="step" x="36" y="204" width="180" height="60" rx="8" stroke-width="1.5"/>
<text class="label mono" x="126" y="231" text-anchor="middle">kioku flag</text>
<text class="sub" x="126" y="246" text-anchor="middle">at the lint</text>
<path class="line" d="M216,234 L256,234" marker-end="url(#h-default)"/>
<rect class="state" x="256" y="204" width="210" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="361" y="231" text-anchor="middle">flagged</text>
<text class="sub" x="361" y="246" text-anchor="middle">a page already in gold</text>
<rect class="plain" x="486" y="204" width="170" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="571" y="231" text-anchor="middle">flag lifted</text>
<text class="sub" x="571" y="246" text-anchor="middle">page unchanged</text>
<rect class="plain" x="676" y="204" width="170" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="761" y="231" text-anchor="middle">copied to .candidats/</text>
<text class="sub" x="761" y="246" text-anchor="middle">fix, then the gate</text>
<rect class="gate" x="866" y="204" width="200" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="966" y="231" text-anchor="middle">LEAVES the wiki</text>
<text class="sub" x="966" y="246" text-anchor="middle">copy in quarantine/&lt;D&gt;/sortis/</text>
<rect class="step" x="36" y="298" width="180" height="60" rx="8" stroke-width="1.5"/>
<text class="label mono" x="126" y="325" text-anchor="middle">kioku quarantine</text>
<text class="sub" x="126" y="340" text-anchor="middle">at ingest</text>
<path class="line" d="M216,328 L256,328" marker-end="url(#h-default)"/>
<rect class="plain" x="256" y="298" width="210" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="361" y="325" text-anchor="middle">pointer</text>
<text class="sub" x="361" y="340" text-anchor="middle">NO page: a passage set aside</text>
<rect class="closed" x="486" y="298" width="170" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="571" y="332.5" text-anchor="middle">refused</text>
<rect class="closed" x="676" y="298" width="170" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="761" y="332.5" text-anchor="middle">refused</text>
<rect class="plain" x="866" y="298" width="200" height="60" rx="8" stroke-width="1.5"/>
<text class="label" x="966" y="325" text-anchor="middle">closed</text>
<text class="sub" x="966" y="340" text-anchor="middle">no page is touched</text>
<rect class="band" x="36" y="392" width="1030" height="40" rx="8" stroke-width="1.5"/>
<text class="label" x="551" y="416.5" text-anchor="middle" style="font-size:13px">kioku decide &lt;D&gt; &lt;name&gt; keep|correct|drop [note]   ·   only after your explicit decision</text>
<text class="sub" x="36" y="480" text-anchor="start">Every decision is logged in quarantine/&lt;D&gt;/decisions.jsonl. A decision that covers a family of cases becomes a rule in domains/&lt;D&gt;/rules.md (Relecture).</text>
<text class="sub" x="36" y="500" text-anchor="start">No session reads quarantine/: open the .md in your editor to judge on the text. After dropping a flagged page, run kioku audit &lt;D&gt; for incoming links.</text>
<rect class="gate" x="36" y="526" width="14" height="14" rx="3" stroke-width="1.5"/><text class="small" x="56" y="537.5" text-anchor="start">destructive</text>
<rect class="closed" x="186" y="526" width="14" height="14" rx="3" stroke-width="1.5"/><text class="small" x="206" y="537.5" text-anchor="start">refused</text>
<rect class="state" x="336" y="526" width="14" height="14" rx="3" stroke-width="1.5"/><text class="small" x="356" y="537.5" text-anchor="start">in gold, flagged</text>
<rect class="plain" x="486" y="526" width="14" height="14" rx="3" stroke-width="1.5"/><text class="small" x="506" y="537.5" text-anchor="start">neutral</text>
</svg>
