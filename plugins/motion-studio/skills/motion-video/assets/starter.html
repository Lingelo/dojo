<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Composition</title>
<style>
  :root {
    --bg: #0b0d12; --ink: #f4efe6; --muted: #8b8f9c; --accent: #d97757;
    --out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --in-expo: cubic-bezier(0.7, 0, 0.84, 0);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; color: var(--ink); position: relative; }

  /* Une scène = un calque plein cadre ; la timeline se lit dans les animation-delay */
  .scene { position: absolute; inset: 0; display: grid; place-items: center; }

  .s1 h1 { font-size: 140px; letter-spacing: -0.04em; opacity: 0;
    animation: rise .9s var(--out-expo) .4s forwards, leave .5s var(--in-expo) 2.6s forwards; }
  .s2 p  { font-size: 56px; color: var(--muted); opacity: 0;
    animation: rise .9s var(--out-expo) 3.0s forwards; }

  @keyframes rise  { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes leave { to { opacity: 0; transform: translateY(-30px); filter: blur(6px); } }
</style>
</head>
<body data-width="1920" data-height="1080" data-fps="60" data-duration="5">
  <section class="scene s1"><h1>Titre</h1></section>
  <section class="scene s2"><p>Sous-titre</p></section>

<script>
  // Optionnel : animation calculée depuis le temps (secondes). Appelé à chaque frame par le renderer.
  // window.__seek = (t) => { … };
</script>
</body>
</html>
