<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>motion-studio — sketch intro</title>
<!--
  Demo sketch: 8 s, 1920×1080, 60 fps.
  Deliberately mixes the 4 techniques handled by the renderer:
    - Canvas 2D   → particle field (rAF + performance.now, seeded Math.random)
    - SVG         → logo stroke (stroke-dashoffset in CSS) + SMIL <animate> pulse
    - CSS         → keyframes with delays (declarative timeline), spring easing through linear()
    - WAAPI + JS  → cards triggered by setTimeout, then element.animate()
  Synced sound, both ways:
    - sound follows picture: data-sfx="…" on the animated elements + window.__sfx() (riser)
    - picture follows sound: window.__audio (beats → card timing, bass → halo and logo)
  Rendu :
    node ../scripts/sfx.mjs bed --bpm 120 --duration 8 --start 2.1 -o bed.wav > bed.json
    node ../scripts/render.mjs sketch-intro.html --audio bed.wav --beats bed.json --motion-blur 4
-->
<style>
  :root {
    --bg: #0b0d12;
    --ink: #f4efe6;
    --muted: #8b8f9c;
    --clay: #d97757;
    --sky: #7aa2f7;
    --mint: #7dcfb6;
    --sun: #e0af68;
    /* damped spring (light overshoot) expressed in CSS linear() */
    --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
    --out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; color: var(--ink); position: relative; }

  canvas { position: absolute; inset: 0; }

  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%); }

  /* ---------- Scene 1-2: logo + title ---------- */
  .stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 36px;
    animation: stage-up 1.1s var(--out-expo) 3.3s both; }
  @keyframes stage-up { to { transform: translate(-50%, -118%) scale(.62); } }

  .logo { width: 220px; height: 220px; overflow: visible; scale: calc(1 + var(--pulse, 0) * 0.05); }
  .logo .hex { fill: none; stroke: var(--clay); stroke-width: 6; stroke-linejoin: round;
    stroke-dasharray: 800; stroke-dashoffset: 800;
    animation: draw 1.4s var(--out-expo) 1.2s forwards; }
  .logo .play { fill: var(--ink); transform-origin: 110px 110px; transform: scale(0);
    animation: pop .9s var(--spring) 2.1s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { to { transform: scale(1); } }

  h1 { font-size: 128px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; display: flex; }
  h1 span { display: inline-block; opacity: 0; transform: translateY(60px) rotate(8deg);
    animation: rise .8s var(--out-expo) forwards; animation-delay: calc(2.2s + var(--i) * 45ms); }
  h1 .accent { color: var(--clay); }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .kicker { font-size: 30px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted);
    opacity: 0; animation: fade .9s ease-out 2.9s forwards; }
  @keyframes fade { to { opacity: 1; } }

  /* ---------- Scene 3: technique cards (WAAPI) ---------- */
  .cards { position: absolute; left: 50%; top: 610px; transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(4, 340px); gap: 28px; }
  .card { height: 250px; border-radius: 28px; padding: 34px; opacity: 0;
    background: linear-gradient(160deg, rgba(30,33,42,.72), rgba(16,18,24,.6));
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.09);
    display: flex; flex-direction: column; justify-content: space-between; }
  .card b { font-size: 46px; font-weight: 750; letter-spacing: -0.02em; }
  .card small { display: block; min-height: 2.7em; margin-top: 8px; font-size: 24px; color: var(--muted); line-height: 1.35; }
  .card i { width: 56px; height: 8px; border-radius: 4px; display: block; }

  /* ---------- Scene 4: tagline ---------- */
  .tagline { position: absolute; left: 0; right: 0; bottom: 92px; text-align: center;
    font-size: 44px; font-weight: 600; letter-spacing: -0.01em; opacity: 0;
    animation: fade .8s ease-out 6.1s forwards; }
  .tagline em { font-style: normal; color: var(--clay); }
  .tagline code { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, monospace; font-size: .8em;
    padding: 4px 14px; border-radius: 10px; background: rgba(217,119,87,.14); color: var(--ink); }

  .curtain { position: absolute; inset: 0; background: var(--bg); opacity: 0;
    animation: fade .6s ease-in 7.4s forwards; }
</style>
</head>
<body data-width="1920" data-height="1080" data-fps="60" data-duration="8">
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div class="vignette"></div>

  <div class="stage" data-sfx="whoosh?dur=.8&from=500&to=6000" data-sfx-gain=".55">
    <svg class="logo" viewBox="0 0 220 220">
      <circle cx="110" cy="110" r="96" fill="none" stroke="var(--clay)" stroke-opacity=".25" stroke-width="2">
        <animate attributeName="r" values="96;104;96" dur="1.6s" begin="2.4s" repeatCount="indefinite" />
        <animate attributeName="stroke-opacity" values=".25;.05;.25" dur="1.6s" begin="2.4s" repeatCount="indefinite" />
      </circle>
      <polygon class="hex" data-sfx="whoosh?dur=1.3&from=180&to=2200" data-sfx-gain=".45" points="110,14 193,62 193,158 110,206 27,158 27,62" />
      <path class="play" data-sfx="impact" d="M92 76 L150 110 L92 144 Z" />
    </svg>
    <h1 id="title"></h1>
    <div class="kicker">Claude Code · motion-studio</div>
  </div>

  <div class="cards" id="cards"></div>

  <p class="tagline" data-sfx="chime" data-sfx-gain=".6">HTML, CSS, SVG, Canvas <em>→</em> <code>render.mjs</code> <em>→</em> MP4 frame by frame.</p>
  <div class="curtain"></div>

<script>
  // ---- title: one <span> per letter, offset through --i
  const title = document.getElementById('title');
  // each letter goes "tick", higher and higher, spatialized by its position (pan auto)
  const letter = (ch, i, cls = '') => `<span class="${cls}" style="--i:${i}" data-sfx="tick?pitch=${(0.8 + i * 0.05).toFixed(2)}" data-sfx-gain=".35" data-sfx-pan="auto">${ch}</span>`;
  [...'Motion'].forEach((ch, i) => title.insertAdjacentHTML('beforeend', letter(ch, i)));
  [...'Studio'].forEach((ch, i) => title.insertAdjacentHTML('beforeend', letter(ch, i + 7, 'accent')));
  title.children[5].style.marginRight = '0.28em';

  // ---- cards: triggered by a timer, animated with WAAPI
  const techs = [
    ['CSS', 'keyframes, transitions, linear() springs', 'var(--clay)'],
    ['SVG', 'strokes, SMIL, morphing', 'var(--sky)'],
    ['Canvas', '2D / WebGL driven by time', 'var(--mint)'],
    ['WAAPI', 'element.animate(), GSAP…', 'var(--sun)'],
  ];
  const cards = document.getElementById('cards');
  for (const [name, desc, color] of techs)
    cards.insertAdjacentHTML('beforeend', `<div class="card" data-sfx="pop?pitch=${(0.9 + cards.children.length * 0.12).toFixed(2)}" data-sfx-gain=".7" data-sfx-pan="auto"><i style="background:${color}"></i><div><b>${name}</b><small>${desc}</small></div></div>`);

  // picture follows music: first card on the beat after 3.6 s, then one per eighth note
  const audio = window.__audio;                          // injected by render.mjs --audio
  const beat = audio ? 60 / audio.bpm : 0.5;
  const cardsAt = audio ? audio.nextBeat(3.6) : 3.7;
  setTimeout(() => {
    [...cards.children].forEach((card, i) => card.animate(
      [{ opacity: 0, transform: 'translateY(120px) scale(.92)' }, { opacity: 1, transform: 'none' }],
      { duration: 900, delay: i * beat * 500, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' }));
  }, cardsAt * 1000);

  // riser that *ends* right on the logo impact (2.1 s)
  window.__sfx?.('riser?dur=2', { at: 2.1, align: 'end', gain: 0.5 });

  // ---- canvas: particles converging to the center, then orbiting.
  // Everything is a function of time t (no accumulated state) → any frame is reproducible.
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, CX = W / 2, CY = H / 2 - 40;
  const N = 900;
  const P = Array.from({ length: N }, () => {
    const a = Math.random() * Math.PI * 2, d = 700 + Math.random() * 900;
    return { x0: CX + Math.cos(a) * d, y0: CY + Math.sin(a) * d * .7,
             orbit: 150 + Math.random() * 520, phase: Math.random() * Math.PI * 2,
             speed: (.15 + Math.random() * .35) * (Math.random() < .5 ? -1 : 1),
             size: .8 + Math.random() * 2.4, hue: Math.random() };
  });
  const easeInOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const colors = ['217,119,87', '122,162,247', '244,239,230'];

  function draw(ms) {
    const t = ms / 1000;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0b0d12';
    ctx.fillRect(0, 0, W, H);

    // breathing central halo
    const bass = audio ? audio.bass(t) : 0, pulse = audio ? audio.beat(t).pulse : 0;
    document.querySelector('.logo').style.setProperty('--pulse', pulse.toFixed(3));
    const glow = clamp((t - .6) / 1.2) * (1 - clamp((t - 6.6) / 1)) * (1 + 0.9 * bass);
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 520);
    g.addColorStop(0, `rgba(217,119,87,${.28 * glow})`);
    g.addColorStop(1, 'rgba(217,119,87,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    const k = easeInOut(clamp(t / 2.2));          // convergence
    const fadeOut = 1 - clamp((t - 7) / .8);
    for (const p of P) {
      const ang = p.phase + t * p.speed;
      const ox = CX + Math.cos(ang) * p.orbit, oy = CY + Math.sin(ang) * p.orbit * .42;
      const x = p.x0 + (ox - p.x0) * k, y = p.y0 + (oy - p.y0) * k;
      const a = (.25 + .75 * k) * fadeOut * (.35 + .65 * Math.abs(Math.sin(t * 1.3 + p.phase)));
      ctx.fillStyle = `rgba(${colors[(p.hue * 3) | 0]},${a})`;
      ctx.beginPath(); ctx.arc(x, y, p.size * (1 + 0.5 * pulse), 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
