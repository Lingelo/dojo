<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>motion-studio — sketch 3D</title>
<!--
  3D sketch: 8 s, 1920×1080, 60 fps — Three.js (WebGL) + HTML/CSS overlay + synced sound.
  - Three.js imported from jsDelivr: the page opens as is in a browser; at render time,
    render.mjs serves these URLs from a local npm cache (offline, pinned version).
  - Everything is a function of t (camera, crystal, shock wave, equalizer) → any frame is reproducible.
  - Picture follows music: bars = energy (bass + level), crystal and bloom pulse on the beats.
  - Sound follows picture: riser → impact at 2.1 s, whoosh on the camera moves, ticks on the title.
  Rendu :
    node ../scripts/sfx.mjs bed --bpm 120 --duration 8 --start 2.1 -o bed.wav > bed.json
    node ../scripts/render.mjs sketch-3d.html --audio bed.wav --beats bed.json --motion-blur 2
-->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root { --bg: #07080c; --ink: #f4efe6; --muted: #9a9fad; --clay: #d97757; --sky: #7aa2f7;
    --out-expo: cubic-bezier(0.16, 1, 0.3, 1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; color: var(--ink); position: relative; }
  canvas { position: absolute; inset: 0; }

  .lower-third { position: absolute; left: 120px; bottom: 120px; }
  .lower-third::before { content: ''; position: absolute; inset: -160px -240px -140px -200px; z-index: -1;
    background: radial-gradient(closest-side, rgba(7,8,12,.78), rgba(7,8,12,0)); }
  .lower-third h1 { font-size: 112px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; display: flex; }
  .lower-third h1 span { display: inline-block; opacity: 0; transform: translateY(50px);
    animation: rise .7s var(--out-expo) forwards; animation-delay: calc(3.1s + var(--i) * 40ms); }
  .lower-third h1 .accent { color: var(--clay); }
  .lower-third p { margin-top: 18px; font-size: 30px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted);
    opacity: 0; animation: fade .8s ease-out 3.7s forwards; }
  .bar { width: 0; height: 6px; border-radius: 3px; margin-bottom: 28px; background: linear-gradient(90deg, var(--clay), var(--sky));
    animation: grow .9s var(--out-expo) 2.9s forwards; }
  .tagline { position: absolute; right: 120px; top: 110px; text-align: right; font-size: 38px; font-weight: 600; line-height: 1.35;
    opacity: 0; animation: slide .9s var(--out-expo) 6.1s forwards; }
  .tagline em { font-style: normal; color: var(--clay); }
  .curtain { position: absolute; inset: 0; background: var(--bg); opacity: 0; animation: fade .6s ease-in 7.4s forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes grow { to { width: 360px; } }
  @keyframes slide { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body data-width="1920" data-height="1080" data-fps="60" data-duration="8">
  <canvas id="gl"></canvas>

  <div class="lower-third">
    <div class="bar" data-sfx="whoosh?dur=.7&from=600&to=5000" data-sfx-gain=".35" data-sfx-pan="-.5"></div>
    <h1 id="title"></h1>
    <p>Three.js · WebGL · synced sound</p>
  </div>
  <div class="tagline" data-sfx="chime" data-sfx-gain=".55">Rendered frame by frame,<br><em>locked to the music.</em></div>
  <div class="curtain"></div>

<script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

  // ---------- HTML title (spatialized ticks)
  const title = document.getElementById('title');
  [...'Motion Studio'].forEach((ch, i) => title.insertAdjacentHTML('beforeend',
    ch === ' ' ? '<span style="width:.3em"></span>'
      : `<span class="${i > 6 ? 'accent' : ''}" style="--i:${i}" data-sfx="tick?pitch=${(0.8 + i * 0.05).toFixed(2)}" data-sfx-gain=".3" data-sfx-pan="auto">${ch}</span>`));

  // ---------- helpers temporels
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const easeInOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const easeOutExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
  const spring = (t, k = 170, c = 14) => { if (t <= 0) return 0; const w0 = Math.sqrt(k), z = c / (2 * w0), wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); };
  const audio = window.__audio;                       // injected by render.mjs --audio (absent in a browser)
  const bass = (t) => (audio ? audio.bass(t) : 0.5 + 0.5 * Math.sin(t * 12.6) ** 8);
  const level = (t) => (audio ? audio.level(t) : 0.5);
  const pulse = (t) => (audio ? audio.beat(t).pulse : 0);
  const HIT = 2.1;                                    // impact: end of the riser, drums come in

  // ---------- son → image, image → son
  window.__sfx?.('whoosh?dur=1.9&from=120&to=1400', { at: 0.15, gain: 0.5 });   // camera arrival
  window.__sfx?.('riser?dur=2', { at: HIT, align: 'end', gain: 0.45 });
  window.__sfx?.('impact', { at: HIT });
  window.__sfx?.('swoosh?dur=.9', { at: 6.6, gain: 0.45 });                        // camera pull-back

  // ---------- rendu
  const W = 1920, H = 1080;
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio);   // --scale 2 → supersampling
  renderer.setSize(W, H, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07080c);
  scene.fog = new THREE.FogExp2(0x07080c, 0.045);
  const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 200);
  camera.setViewOffset(W, H, -230, 70, W, H);          // subject shifted up and right, room for the title

  scene.add(new THREE.AmbientLight(0x404660, 0.6));
  const key = new THREE.DirectionalLight(0xffe2cc, 2.2); key.position.set(4, 6, 5); scene.add(key);
  const warm = new THREE.PointLight(0xd97757, 30, 20); scene.add(warm);
  const cool = new THREE.PointLight(0x7aa2f7, 30, 20); scene.add(cool);

  // cristal + coque filaire
  const crystal = new THREE.Mesh(new THREE.IcosahedronGeometry(1.15, 0),
    new THREE.MeshStandardMaterial({ color: 0xd97757, metalness: 0.35, roughness: 0.28, flatShading: true, emissive: 0x3a120a }));
  scene.add(crystal);
  const shell = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.75, 1)),
    new THREE.LineBasicMaterial({ color: 0x7aa2f7, transparent: true, opacity: 0.0 }));
  scene.add(shell);

  // shock wave at the impact
  const shock = new THREE.Mesh(new THREE.RingGeometry(0.96, 1, 128),
    new THREE.MeshBasicMaterial({ color: 0xffc9a8, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  shock.rotation.x = -Math.PI / 2; scene.add(shock);

  // 3D equalizer: ring of bars driven by the audio
  const N = 72, R = 3.3;
  const bars = new THREE.InstancedMesh(new THREE.BoxGeometry(0.13, 1, 0.13).translate(0, 0.5, 0), new THREE.MeshBasicMaterial({ toneMapped: false }), N);
  const cA = new THREE.Color(0xd97757), cB = new THREE.Color(0x7aa2f7), cC = new THREE.Color(0x7dcfb6), tmp = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const u = i / N, x = (u * 3) % 1;
    bars.setColorAt(i, tmp.copy(u < 1 / 3 ? cA : u < 2 / 3 ? cB : cC).lerp(u < 1 / 3 ? cB : u < 2 / 3 ? cC : cA, x).multiplyScalar(1.0));
  }
  bars.position.y = -1.2; scene.add(bars);
  const dummy = new THREE.Object3D();

  // polar grid floor + stars (seeded positions)
  const grid = new THREE.PolarGridHelper(14, 24, 10, 96, 0x2a2f3d, 0x1a1e28); grid.position.y = -1.2; scene.add(grid);
  const starGeo = new THREE.BufferGeometry(), sp = new Float32Array(1800 * 3);
  for (let i = 0; i < 1800; i++) { const r = 18 + Math.random() * 30, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    sp.set([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)], i * 3); }
  starGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xcfd6ff, size: 0.07, sizeAttenuation: true, transparent: true, opacity: 0.8 })));

  // post-traitement : bloom
  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(window.devicePixelRatio);
  composer.setSize(W, H);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.5, 0.5, 0.12);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  function draw(ms) {
    const t = ms / 1000;
    const hit = seg(t, HIT, HIT + 0.6);

    // camera: arrival (0→2.1), orbit (2.1→6.6), pull-back (6.6→8)
    const arrive = easeInOut(seg(t, 0, HIT));
    const orbit = easeInOut(seg(t, HIT, 6.6)) * Math.PI * 1.15 + 0.35;
    const back = easeInOut(seg(t, 6.6, 8));
    const dist = THREE.MathUtils.lerp(26, 10.5, arrive) + back * 7;
    const height = THREE.MathUtils.lerp(7, 1.6, arrive) + Math.sin(t * 0.9) * 0.25 + back * 4;
    camera.position.set(Math.sin(orbit) * dist, height, Math.cos(orbit) * dist);
    camera.lookAt(0, 0.1 + back * -0.5, 0);

    // crystal: grows toward the impact, spring pop, pulses on the beats
    const pre = 0.35 + 0.25 * easeInOut(seg(t, 0.4, HIT));
    const pop = t < HIT ? pre : pre + (1 - pre) * spring(t - HIT);
    const s = pop * (1 + 0.09 * pulse(t));
    crystal.scale.setScalar(s);
    crystal.rotation.set(t * 0.35, t * 0.6, 0);
    crystal.material.emissiveIntensity = 1 + 1.5 * pulse(t) + 2 * (1 - hit) * (t >= HIT);
    shell.scale.setScalar(0.8 + 0.25 * easeOutExpo(hit) + 0.05 * bass(t));
    shell.rotation.set(-t * 0.2, -t * 0.25, 0);
    shell.material.opacity = 0.55 * easeOutExpo(hit) * (1 - seg(t, 7.2, 8));

    // onde de choc
    const k = seg(t, HIT, HIT + 1.1);
    shock.scale.setScalar(1 + easeOutExpo(k) * 13);
    shock.material.opacity = t < HIT ? 0 : (1 - k) * 0.6;

    // equalizer: amplitude waking up at the impact, wave going round the ring
    const alive = easeOutExpo(seg(t, HIT, HIT + 0.7)) * (1 - 0.7 * back);
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      const delay = (Math.abs(((i / N) + 0.25) % 1 - 0.5)) * 0.18;           // wave from the front
      const e = 0.6 * bass(t - delay) + 0.5 * level(t - delay) * (0.5 + 0.5 * Math.sin(i * 0.9 + t * 3));
      dummy.position.set(Math.cos(a) * R, 0, Math.sin(a) * R);
      dummy.rotation.y = -a;
      dummy.scale.set(1, 0.03 + alive * (0.2 + 1.8 * e), 1);
      dummy.updateMatrix();
      bars.setMatrixAt(i, dummy.matrix);
    }
    bars.instanceMatrix.needsUpdate = true;
    bars.rotation.y = t * 0.12;

    // orbiting lights, breathing bloom
    warm.position.set(Math.cos(t * 1.1) * 3, 1.5, Math.sin(t * 1.1) * 3);
    cool.position.set(Math.cos(t * 1.1 + Math.PI) * 3, -0.5, Math.sin(t * 1.1 + Math.PI) * 3);
    bloom.strength = 0.4 + 0.45 * bass(t) * alive + 0.55 * (1 - hit) * (t >= HIT);

    composer.render();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
