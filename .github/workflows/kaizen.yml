name: kaizen

on:
  pull_request:
    paths:
      - 'plugins/kaizen/**'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/kaizen.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/kaizen/**'

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Identité git pour les dépôts de test
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Syntaxe des scripts
        run: for f in plugins/kaizen/scripts/*.mjs plugins/kaizen/evals/*.mjs; do node --check "$f"; done
      - name: Tests unitaires, CLI, garde-fou, PR et contrats
        run: node --test plugins/kaizen/tests/*.test.mjs
