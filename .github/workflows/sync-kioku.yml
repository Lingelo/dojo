name: sync-kioku

# Copies kioku (its own public repository) into plugins/kioku/, so that it ships as an internal plugin: Claude Code's
# marketplace auto-update follows the plugins that live in the marketplace, and did not follow kioku as an external
# source. The copy is never edited here; kioku changes in its own repository.
#
# Triggers: hourly; by hand (Actions > sync-kioku > Run workflow); or right after a push to kioku, if kioku's CI
# sends a repository_dispatch of type "kioku-updated" (needs a token with access to this repository, not set up).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [kioku-updated]
  pull_request:
    paths:
      - '.github/scripts/sync-kioku*.mjs'
      - '.github/workflows/sync-kioku.yml'

# One run at a time: two overlapping runs would race on the same push.
concurrency:
  group: sync-kioku
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/sync-kioku.test.mjs

  sync:
    needs: test
    # A pull request only runs the tests: the copy is pushed from main only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy kioku main into plugins/kioku
        run: node .github/scripts/sync-kioku.mjs --source Lingelo/kioku --ref main
      - name: Commit and push if the copy changed
        run: |
          git add -A plugins/kioku .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "plugins/kioku already up to date"
            exit 0
          fi
          sha=$(sed -n 's/^sha: //p' plugins/kioku/.kioku-source)
          git -c user.name=Claude -c user.email=noreply@anthropic.com commit -q \
            -m "chore(kioku): sync plugins/kioku to Lingelo/kioku@${sha:0:7}" \
            -m "Copied by .github/workflows/sync-kioku.yml from https://github.com/Lingelo/kioku/commit/${sha}"
          git push origin HEAD:main
